k&quot;:&quot;Early activation/anxiety, sexual effects and discontinuation symptoms are clinically relevant.&quot;,&quot;extension&quot;:&quot;The anxiety branch and depression branch converge on the same drug profiles; indication changes do not require inventing a new molecular mechanism.&quot;,&quot;topics&quot;:[&quot;A17&quot;]},&quot;daridorexant&quot;:{&quot;name&quot;:&quot;Daridorexant&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Dual orexin antagonist reduces wake drive&quot;,&quot;explanation&quot;:&quot;Blocks OX₁ and OX₂ receptors. Orexin neurons in the lateral hypothalamus normally stabilise wakefulness by stimulating arousal systems; blocking their signal helps sleep onset and maintenance.&quot;,&quot;kinetics&quot;:&quot;Hepatic CYP3A metabolism; interactions can change exposure.&quot;,&quot;risk&quot;:&quot;Somnolence, impaired alertness and sleep-related phenomena; narcolepsy is an important contraindication.&quot;,&quot;extension&quot;:&quot;This reduces a wake-promoting signal rather than enhancing GABA-A inhibition. The two approaches reach sleep through different network mechanisms.&quot;,&quot;topics&quot;:[&quot;A17&quot;]},&quot;pindolol&quot;:{&quot;name&quot;:&quot;Pindolol&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;β blocker; nonstandard serotonergic adjunct&quot;,&quot;explanation&quot;:&quot;A nonselective beta blocker with intrinsic sympathomimetic activity and affinity at 5-HT₁A receptors. It has been studied as an antidepressant augmentation strategy; its workbook presence does not make it a standard stand-alone anxiolytic.&quot;,&quot;kinetics&quot;:&quot;Cardiovascular and central receptor actions coexist; kinetics are distinct from SSRI accumulation.&quot;,&quot;risk&quot;:&quot;Bradycardia, hypotension and bronchospasm in susceptible patients.&quot;,&quot;extension&quot;:&quot;A proposed rationale is interference with inhibitory serotonergic autoreceptor feedback. Evidence and routine use are more limited than the major SSRI/SNRI anxiety treatments.&quot;,&quot;topics&quot;:[&quot;A17&quot;],&quot;focus&quot;:{&quot;type&quot;:&quot;Workbook entry · no specific emphasis verified&quot;,&quot;text&quot;:&quot;Included because A17 lists it. Its beta-blocking and serotonergic pharmacology does not establish it as a standard stand-alone treatment for an anxiety disorder. No specific spoken emphasis was located in the checked material.&quot;}},&quot;chloral-hydrate&quot;:{&quot;name&quot;:&quot;Chloral hydrate&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Older sedative; active trichloroethanol&quot;,&quot;explanation&quot;:&quot;An older sedative-hypnotic converted to trichloroethanol, which produces CNS depression. It is not a benzodiazepine and is not a modern preferred general solution for insomnia.&quot;,&quot;kinetics&quot;:&quot;Active-metabolite formation contributes to its duration.&quot;,&quot;risk&quot;:&quot;Gastric irritation, respiratory depression and cardiac arrhythmias limit usefulness; dependence can occur.&quot;,&quot;extension&quot;:&quot;A drug name resembling chlordiazepoxide does not imply the same chemical family or antidote.&quot;,&quot;topics&quot;:[&quot;A17&quot;]},&quot;valerian&quot;:{&quot;name&quot;:&quot;Valeriana (valerian)&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Herbal preparation; variable composition/evidence&quot;,&quot;explanation&quot;:&quot;Valerian preparations contain several constituents; GABA-related actions have been proposed, but a single established receptor mechanism does not explain all products. It is a course example among sedative herbal medicines.&quot;,&quot;kinetics&quot;:&quot;Composition and exposure vary with preparation, limiting precise comparisons with defined single molecules.&quot;,&quot;risk&quot;:&quot;Drowsiness and additive effects with other sedatives; efficacy and quality are not uniform across preparations.&quot;,&quot;extension&quot;:&quot;&#x27;Natural&#x27; identifies origin, not a guaranteed magnitude of benefit or absence of interactions. Keep this evidence limit visible alongside the proposed mechanism.&quot;,&quot;topics&quot;:[&quot;A17&quot;],&quot;focus&quot;:{&quot;type&quot;:&quot;Workbook entry · no specific emphasis verified&quot;,&quot;text&quot;:&quot;Included because A17 lists Valeriana. Evidence and composition vary by preparation; the checked material does not justify a precise single-target mechanism or a claim that the teacher specifically emphasised this entry.&quot;}},&quot;chlorpromazine&quot;:{&quot;name&quot;:&quot;Chlorpromazine&quot;,&quot;family&quot;:&quot;antipsychotic&quot;,&quot;feature&quot;:&quot;Low-potency D₂ blocker; sedating/autonomic effects&quot;,&quot;explanation&quot;:&quot;A first-generation phenothiazine antipsychotic. Alongside D₂ blockade, substantial H₁, muscarinic and α₁ effects explain sedation, anticholinergic symptoms and orthostatic hypotension.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism; receptor effects extend beyond the desired antipsychotic circuit.&quot;,&quot;risk&quot;:&quot;Hypotension, sedation, weight gain and anticholinergic effects; extrapyramidal and prolactin effects still occur.&quot;,&quot;extension&quot;:&quot;Low potency does not mean weak maximum efficacy. It means a larger dose is required relative to a high-potency comparator such as haloperidol.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;flupentixol&quot;:{&quot;name&quot;:&quot;Flupentixol (flupenthixol)&quot;,&quot;family&quot;:&quot;antipsychotic&quot;,&quot;feature&quot;:&quot;Thioxanthene; oral and depot exposure&quot;,&quot;explanation&quot;:&quot;A first-generation thioxanthene with prominent dopamine-receptor antagonism. Its chemical family distinguishes it from phenothiazines and butyrophenones.&quot;,&quot;kinetics&quot;:&quot;Long-acting ester depot formulations release drug slowly; oral and depot kinetics must not be confused.&quot;,&quot;risk&quot;:&quot;Extrapyramidal symptoms, akathisia and prolactin elevation; prolonged exposure can make adverse effects slow to resolve.&quot;,&quot;extension&quot;:&quot;A depot changes delivery kinetics, not receptor mechanism. Improved dosing continuity comes with reduced ability to remove exposure immediately.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;zuclopenthixol&quot;:{&quot;name&quot;:&quot;Zuclopenthixol&quot;,&quot;family&quot;:&quot;antipsychotic&quot;,&quot;feature&quot;:&quot;Thioxanthene with formulation-dependent duration&quot;,&quot;explanation&quot;:&quot;A dopamine-antagonist antipsychotic used in different formulations for differing time horizons. It is related to clopenthixol, but the workbook&#x27;s abbreviated spelling should map to the recognised drug name.&quot;,&quot;kinetics&quot;:&quot;Acetate and decanoate formulations have different durations; the long-acting depot does not behave like an immediate oral dose.&quot;,&quot;risk&quot;:&quot;Sedation, hypotension, extrapyramidal effects and prolactin elevation.&quot;,&quot;extension&quot;:&quot;Always distinguish the active molecule from its formulation when a question asks about rapid calming versus maintenance exposure.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;haloperidol&quot;:{&quot;name&quot;:&quot;Haloperidol&quot;,&quot;family&quot;:&quot;antipsychotic&quot;,&quot;feature&quot;:&quot;High-potency D₂ blockade; motor adverse effects&quot;,&quot;explanation&quot;:&quot;A first-generation butyrophenone with relatively strong D₂ antagonism. Used for psychosis and selected agitation/movement-disorder settings.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism; oral, injectable and depot preparations differ in time course.&quot;,&quot;risk&quot;:&quot;Acute dystonia, akathisia, parkinsonism, hyperprolactinaemia and QT-related risk.&quot;,&quot;extension&quot;:&quot;Blocking dopamine can reduce hyperkinetic movement but also cause a hypokinetic syndrome. The baseline circuit abnormality determines whether that direction is useful.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;droperidol&quot;:{&quot;name&quot;:&quot;Droperidol&quot;,&quot;family&quot;:&quot;antipsychotic&quot;,&quot;feature&quot;:&quot;Perioperative antiemetic; QT concern&quot;,&quot;explanation&quot;:&quot;A butyrophenone D₂ antagonist often recognised through perioperative antiemetic and sedative use. Area-postrema D₂ blockade helps suppress emesis.&quot;,&quot;kinetics&quot;:&quot;Relatively brief parenteral clinical use compared with maintenance antipsychotic regimens.&quot;,&quot;risk&quot;:&quot;QT prolongation, hypotension and extrapyramidal reactions are important.&quot;,&quot;extension&quot;:&quot;An &#x27;antipsychotic&#x27; chemical/receptor class does not restrict every clinical use to psychosis; location and exposure change the useful endpoint.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;clozapine&quot;:{&quot;name&quot;:&quot;Clozapine&quot;,&quot;family&quot;:&quot;antipsychotic&quot;,&quot;feature&quot;:&quot;Treatment-resistant schizophrenia; blood/myocardial risks&quot;,&quot;explanation&quot;:&quot;A multireceptor antipsychotic with relatively low extrapyramidal liability and a particular role in treatment-resistant schizophrenia. Its profile cannot be reduced to strong D₂ blockade alone.&quot;,&quot;kinetics&quot;:&quot;CYP1A2-related handling is important; smoking changes and inflammatory illness can alter exposure.&quot;,&quot;risk&quot;:&quot;Neutropenia/agranulocytosis, myocarditis, severe constipation/ileus, seizures and metabolic effects require attention.&quot;,&quot;extension&quot;:&quot;Drooling is a characteristic paradox despite antimuscarinic properties and has a multifactorial mechanism. Do not explain every clozapine effect with a single receptor label.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;olanzapine&quot;:{&quot;name&quot;:&quot;Olanzapine&quot;,&quot;family&quot;:&quot;antipsychotic&quot;,&quot;feature&quot;:&quot;Prominent weight/metabolic burden&quot;,&quot;explanation&quot;:&quot;An atypical antipsychotic with dopamine and serotonin receptor antagonism plus H₁ and other effects. Used in schizophrenia and selected bipolar phases.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism, including CYP1A2, creates interaction links.&quot;,&quot;risk&quot;:&quot;Weight gain, dyslipidaemia, hyperglycaemia and sedation are prominent; extrapyramidal effects remain possible.&quot;,&quot;extension&quot;:&quot;H₁ and 5-HT₂C signalling contribute to appetite regulation, explaining why efficacy and metabolic tolerability must be assessed separately.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;quetiapine&quot;:{&quot;name&quot;:&quot;Quetiapine&quot;,&quot;family&quot;:&quot;antipsychotic&quot;,&quot;feature&quot;:&quot;Sedating; relatively low EPS; bipolar roles&quot;,&quot;explanation&quot;:&quot;An atypical antipsychotic with relatively low extrapyramidal liability and clinically useful bipolar-depression/mania roles. H₁ and α₁ effects contribute sedation and orthostasis.&quot;,&quot;kinetics&quot;:&quot;CYP3A metabolism produces active norquetiapine, adding pharmacological actions beyond the parent drug.&quot;,&quot;risk&quot;:&quot;Sedation, orthostatic hypotension and metabolic effects.&quot;,&quot;extension&quot;:&quot;Norquetiapine has NET-inhibiting activity; one active metabolite can help explain why the clinical profile extends beyond the simple parent D₂/5-HT₂A description.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;risperidone&quot;:{&quot;name&quot;:&quot;Risperidone&quot;,&quot;family&quot;:&quot;antipsychotic&quot;,&quot;feature&quot;:&quot;D₂/5-HT₂A antagonist; prolactin elevation&quot;,&quot;explanation&quot;:&quot;An atypical antipsychotic whose D₂ blockade can substantially raise prolactin and cause dose-related motor effects, despite the &#x27;atypical&#x27; classification.&quot;,&quot;kinetics&quot;:&quot;CYP2D6 forms active 9-hydroxyrisperidone, also marketed as paliperidone.&quot;,&quot;risk&quot;:&quot;Hyperprolactinaemia, extrapyramidal symptoms, weight gain and orthostasis.&quot;,&quot;extension&quot;:&quot;The active-metabolite relationship links A18 to pharmacokinetics: blocking metabolism can change parent/metabolite proportions without simply erasing all active exposure.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;paliperidone&quot;:{&quot;name&quot;:&quot;Paliperidone&quot;,&quot;family&quot;:&quot;antipsychotic&quot;,&quot;feature&quot;:&quot;Active risperidone metabolite; renal handling&quot;,&quot;explanation&quot;:&quot;9-Hydroxyrisperidone retains dopamine/serotonin antagonism. It is administered as a medicine in its own right rather than relying on conversion from risperidone.&quot;,&quot;kinetics&quot;:&quot;Substantial renal elimination; oral extended-release and depot formulations differ.&quot;,&quot;risk&quot;:&quot;Prolactin elevation, extrapyramidal effects and QT-related concerns.&quot;,&quot;extension&quot;:&quot;Active metabolites can become separate products. A familiar receptor profile can coexist with a different dominant elimination pathway.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;ziprasidone&quot;:{&quot;name&quot;:&quot;Ziprasidone&quot;,&quot;family&quot;:&quot;antipsychotic&quot;,&quot;feature&quot;:&quot;Lower weight burden; QT prolongation&quot;,&quot;explanation&quot;:&quot;An atypical agent with D₂ antagonism and serotonin actions. It is not a D₂ partial agonist, despite an inconsistent classification slide.&quot;,&quot;kinetics&quot;:&quot;Oral absorption is increased with food; hepatic pathways contribute to elimination.&quot;,&quot;risk&quot;:&quot;QT prolongation is a central distinction; weight gain is generally less prominent than with olanzapine, but motor effects can occur.&quot;,&quot;extension&quot;:&quot;A more favourable weight profile does not make it safer on every axis; compare metabolic and cardiac risks separately.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;tiapride&quot;:{&quot;name&quot;:&quot;Tiapride&quot;,&quot;family&quot;:&quot;antipsychotic&quot;,&quot;feature&quot;:&quot;Relatively selective D₂/D₃ benzamide&quot;,&quot;explanation&quot;:&quot;A substituted benzamide used in selected hyperkinetic movement, agitation and related settings, varying by country. It has relatively little affinity for many other receptor families.&quot;,&quot;kinetics&quot;:&quot;Largely renal elimination with little metabolism is a useful distinction.&quot;,&quot;risk&quot;:&quot;Hyperprolactinaemia, extrapyramidal effects and cardiac risk remain possible despite narrower receptor affinity.&quot;,&quot;extension&quot;:&quot;It appears in the Huntington lecture as a dopamine-reducing option. The therapeutic aim is suppression of excessive movement, not restoration of dopamine as in Parkinson disease.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;amisulpride&quot;:{&quot;name&quot;:&quot;Amisulpride&quot;,&quot;family&quot;:&quot;antipsychotic&quot;,&quot;feature&quot;:&quot;D₂/D₃-focused atypical; prolactin/QT risks&quot;,&quot;explanation&quot;:&quot;A substituted benzamide with relatively selective D₂/D₃ antagonism, rather than relying on the broad serotonin–dopamine profile of many other atypical agents.&quot;,&quot;kinetics&quot;:&quot;Predominantly renal elimination; kidney function can affect exposure.&quot;,&quot;risk&quot;:&quot;Hyperprolactinaemia, QT prolongation and extrapyramidal effects.&quot;,&quot;extension&quot;:&quot;&#x27;Atypical&#x27; is a clinical grouping with heterogeneous receptor mechanisms; it does not guarantee a 5-HT₂A-dominant profile or freedom from prolactin elevation.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;aripiprazole&quot;:{&quot;name&quot;:&quot;Aripiprazole&quot;,&quot;family&quot;:&quot;partiald2&quot;,&quot;feature&quot;:&quot;D₂ partial agonist; lower prolactin tendency&quot;,&quot;explanation&quot;:&quot;Combines D₂ partial agonism with serotonin receptor actions. Often has less prolactin elevation than strong D₂ antagonists, while retaining antipsychotic efficacy.&quot;,&quot;kinetics&quot;:&quot;Long persistence; CYP2D6 and CYP3A4 interactions affect exposure.&quot;,&quot;risk&quot;:&quot;Akathisia and impulse-control problems can occur; lower metabolic burden is relative.&quot;,&quot;extension&quot;:&quot;The same partial-agonist logic is a useful link to buprenorphine, although the receptor systems and clinical effects are different.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;cariprazine&quot;:{&quot;name&quot;:&quot;Cariprazine&quot;,&quot;family&quot;:&quot;partiald2&quot;,&quot;feature&quot;:&quot;D₃-preferring partial agonist; long metabolites&quot;,&quot;explanation&quot;:&quot;A D₃/D₂ partial agonist with particular D₃ affinity, developed in Hungary. Indications depend on jurisdiction, including schizophrenia and selected bipolar settings.&quot;,&quot;kinetics&quot;:&quot;Active metabolites persist for a long time, so dose changes can have delayed full effects.&quot;,&quot;risk&quot;:&quot;Akathisia and other extrapyramidal effects; adverse effects may persist after a change.&quot;,&quot;extension&quot;:&quot;A short observation period after changing the dose may miss the eventual steady exposure because metabolites accumulate slowly.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;disulfiram&quot;:{&quot;name&quot;:&quot;Disulfiram&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Alcohol deterrent via aldehyde dehydrogenase inhibition&quot;,&quot;explanation&quot;:&quot;Inhibits aldehyde dehydrogenase. If ethanol is consumed, acetaldehyde accumulates and produces flushing, nausea, tachycardia and potentially severe cardiovascular effects. Its role is selected alcohol-use-disorder treatment, not ordinary antipsychotic therapy.&quot;,&quot;kinetics&quot;:&quot;Enzyme inhibition persists beyond the immediate presence of the parent drug.&quot;,&quot;risk&quot;:&quot;Hepatotoxicity and neuropsychiatric effects can occur; alcohol exposure during the active inhibitory period is hazardous.&quot;,&quot;extension&quot;:&quot;The A18 placement is a course-list convention. Classify the actual clinical role separately instead of forcing every entry into dopamine-blocking antipsychotics.&quot;,&quot;topics&quot;:[&quot;A18&quot;]},&quot;clomipramine&quot;:{&quot;name&quot;:&quot;Clomipramine&quot;,&quot;family&quot;:&quot;tca&quot;,&quot;feature&quot;:&quot;Strong serotonergic TCA; OCD role&quot;,&quot;explanation&quot;:&quot;A tricyclic with relatively strong SERT inhibition. Its obsessive–compulsive disorder association helps distinguish it within the TCA group.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism produces an active metabolite; enzyme interactions can alter exposure.&quot;,&quot;risk&quot;:&quot;Anticholinergic effects, orthostasis, cardiac toxicity in overdose and serotonergic interactions.&quot;,&quot;extension&quot;:&quot;&#x27;Tricyclic&#x27; describes chemistry, while &#x27;strong SERT inhibition&#x27; describes target preference; both are needed for useful classification.&quot;,&quot;topics&quot;:[&quot;A19&quot;]},&quot;amitriptyline&quot;:{&quot;name&quot;:&quot;Amitriptyline&quot;,&quot;family&quot;:&quot;tca&quot;,&quot;feature&quot;:&quot;Sedating TCA; neuropathic pain and migraine prevention&quot;,&quot;explanation&quot;:&quot;Blocks monoamine reuptake with prominent H₁, muscarinic and α₁ effects. Its analgesic and headache-preventive roles explain its repeated appearance outside the depression topic.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism includes conversion to active nortriptyline.&quot;,&quot;risk&quot;:&quot;Sedation, weight gain, dry mouth, constipation, orthostasis and dangerous overdose cardiotoxicity.&quot;,&quot;extension&quot;:&quot;An analgesic response in neuropathic pain can occur without the patient being depressed: descending pain modulation is itself a relevant target.&quot;,&quot;topics&quot;:[&quot;A13&quot;,&quot;A19&quot;]},&quot;nortriptyline&quot;:{&quot;name&quot;:&quot;Nortriptyline&quot;,&quot;family&quot;:&quot;tca&quot;,&quot;feature&quot;:&quot;More NET-preferring secondary-amine TCA&quot;,&quot;explanation&quot;:&quot;A secondary-amine tricyclic and active amitriptyline metabolite, with relatively stronger noradrenergic reuptake inhibition than the parent.&quot;,&quot;kinetics&quot;:&quot;CYP2D6 handling makes metabolic variation and inhibitors important.&quot;,&quot;risk&quot;:&quot;Retains cardiac and anticholinergic concerns, although its profile may be less sedating/anticholinergic than amitriptyline&#x27;s.&quot;,&quot;extension&quot;:&quot;Metabolism can produce another active medicine with a shifted target balance, not merely an inactive waste product.&quot;,&quot;topics&quot;:[&quot;A19&quot;]},&quot;fluoxetine&quot;:{&quot;name&quot;:&quot;Fluoxetine&quot;,&quot;family&quot;:&quot;ssri&quot;,&quot;feature&quot;:&quot;Long-lived active metabolite; CYP2D6 inhibition&quot;,&quot;explanation&quot;:&quot;An SSRI with a long persistence due to fluoxetine and norfluoxetine. Useful in depression and other disorder-specific indications.&quot;,&quot;kinetics&quot;:&quot;Strong CYP2D6 inhibition and long active-metabolite persistence create interactions that can continue after stopping.&quot;,&quot;risk&quot;:&quot;Activation, sexual effects and serotonin toxicity with incompatible combinations. Transition to a psychiatric MAO inhibitor requires a long washout specified in labeling.&quot;,&quot;extension&quot;:&quot;The usual fluoxetine-to-MAO-inhibitor interval is at least five weeks; the reason is persistent active exposure, not that receptor blockade ceases the day tablets stop.&quot;,&quot;topics&quot;:[&quot;A19&quot;]},&quot;sertraline&quot;:{&quot;name&quot;:&quot;Sertraline&quot;,&quot;family&quot;:&quot;ssri&quot;,&quot;feature&quot;:&quot;Broad depression/anxiety indications&quot;,&quot;explanation&quot;:&quot;Primarily inhibits SERT. Its clinically useful antidepressant/anxiolytic profile should be learned before secondary in-vitro transporter actions.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism; less persistent active exposure than fluoxetine, though individual illness/interactions still matter.&quot;,&quot;risk&quot;:&quot;Gastrointestinal symptoms, including diarrhoea, and sexual dysfunction are common distinctions.&quot;,&quot;extension&quot;:&quot;A different SSRI can be tolerated differently despite the shared main target; receptor-independent kinetics and individual response also matter.&quot;,&quot;topics&quot;:[&quot;A19&quot;]},&quot;citalopram&quot;:{&quot;name&quot;:&quot;Citalopram&quot;,&quot;family&quot;:&quot;ssri&quot;,&quot;feature&quot;:&quot;Racemic SSRI; dose-related QT concern&quot;,&quot;explanation&quot;:&quot;A relatively selective SERT inhibitor supplied as a racemate. It lacks the broad muscarinic/α₁ blockade typical of TCAs.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism, including CYP2C19; exposure rises with some inhibitors and impaired metabolism.&quot;,&quot;risk&quot;:&quot;Dose/exposure-related QT prolongation in addition to general SSRI effects.&quot;,&quot;extension&quot;:&quot;Greater transporter selectivity does not exclude ion-channel effects at the heart, so &#x27;selective&#x27; must always be read as selective for a specified comparison.&quot;,&quot;topics&quot;:[&quot;A19&quot;]},&quot;escitalopram&quot;:{&quot;name&quot;:&quot;Escitalopram&quot;,&quot;family&quot;:&quot;ssri&quot;,&quot;feature&quot;:&quot;S-enantiomer of citalopram&quot;,&quot;explanation&quot;:&quot;The S-enantiomer accounts for the main SERT-inhibiting activity of citalopram. Used for depression and selected anxiety disorders.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism, including CYP2C19; not interchangeable milligram-for-milligram with the racemate.&quot;,&quot;risk&quot;:&quot;Sexual effects, GI symptoms, hyponatraemia and QT-related cautions at susceptible exposure.&quot;,&quot;extension&quot;:&quot;Compare stereoisomer selection here with levobupivacaine or dexibuprofen: the naming distinction changes dose/interaction details, not the need to understand the main target.&quot;,&quot;topics&quot;:[&quot;A19&quot;]},&quot;paroxetine&quot;:{&quot;name&quot;:&quot;Paroxetine&quot;,&quot;family&quot;:&quot;ssri&quot;,&quot;feature&quot;:&quot;Strong CYP2D6 inhibition; discontinuation symptoms&quot;,&quot;explanation&quot;:&quot;An SSRI with appreciable anticholinergic activity relative to several peers. It is a useful exam example for interactions involving CYP2D6.&quot;,&quot;kinetics&quot;:&quot;Relatively short persistence and strong CYP2D6 inhibition; abrupt cessation can produce prominent discontinuation symptoms.&quot;,&quot;risk&quot;:&quot;Sexual dysfunction, weight gain, anticholinergic effects and withdrawal symptoms.&quot;,&quot;extension&quot;:&quot;It can reduce codeine activation to morphine. For an already-active CYP2D6 substrate, enzyme inhibition can instead increase exposure.&quot;,&quot;topics&quot;:[&quot;A19&quot;]},&quot;reboxetine&quot;:{&quot;name&quot;:&quot;Reboxetine&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Selective NET inhibitor&quot;,&quot;explanation&quot;:&quot;Blocks the noradrenaline transporter, prolonging noradrenergic signalling. Used as an antidepressant in relevant jurisdictions; it is not an SSRI.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism, including CYP3A4, contributes to interaction potential.&quot;,&quot;risk&quot;:&quot;Dry mouth, constipation, insomnia, tachycardia and urinary difficulty can occur.&quot;,&quot;extension&quot;:&quot;The label NRI is more precise than an ambiguous &#x27;SNRI&#x27; abbreviation when the intended target is NET alone.&quot;,&quot;topics&quot;:[&quot;A19&quot;]},&quot;atomoxetine&quot;:{&quot;name&quot;:&quot;Atomoxetine&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;NET inhibitor used for ADHD&quot;,&quot;explanation&quot;:&quot;Blocks NET and increases noradrenergic signalling. In prefrontal cortex, where dopamine clearance also involves NET, it can increase extracellular dopamine without the same striatal transporter profile as classical stimulants.&quot;,&quot;kinetics&quot;:&quot;CYP2D6 metabolism creates major exposure differences with poor metabolism or strong inhibitors.&quot;,&quot;risk&quot;:&quot;Reduced appetite, increased pulse/BP and gastrointestinal effects; rare liver injury and mood/suicidality monitoring concerns.&quot;,&quot;extension&quot;:&quot;Its placement beside antidepressant transporter inhibitors describes mechanism; its main clinical identity is ADHD treatment, not a standard antidepressant.&quot;,&quot;topics&quot;:[&quot;A19&quot;]},&quot;venlafaxine&quot;:{&quot;name&quot;:&quot;Venlafaxine&quot;,&quot;family&quot;:&quot;snri&quot;,&quot;feature&quot;:&quot;Dose-related NET effect; withdrawal and BP&quot;,&quot;explanation&quot;:&quot;SERT inhibition is more prominent at lower exposure, with greater noradrenergic contribution as exposure rises. Used in depression/anxiety and as a course headache-preventive example.&quot;,&quot;kinetics&quot;:&quot;Converted to active desvenlafaxine; relatively short persistence can make abrupt discontinuation difficult.&quot;,&quot;risk&quot;:&quot;Blood-pressure elevation, sweating, sexual effects and discontinuation symptoms.&quot;,&quot;extension&quot;:&quot;The same drug can change its balance of transporter effects across the dose range; class labels are useful but do not specify a fixed SERT:NET ratio.&quot;,&quot;topics&quot;:[&quot;A13&quot;,&quot;A17&quot;,&quot;A19&quot;]},&quot;duloxetine&quot;:{&quot;name&quot;:&quot;Duloxetine&quot;,&quot;family&quot;:&quot;snri&quot;,&quot;feature&quot;:&quot;Depression + neuropathic-pain benefit&quot;,&quot;explanation&quot;:&quot;Inhibits SERT and NET. Enhancement of descending inhibitory pain pathways supports use in selected neuropathic and chronic pain conditions, including diabetic neuropathic pain.&quot;,&quot;kinetics&quot;:&quot;Hepatic CYP1A2/CYP2D6 metabolism; hepatic disease and interactions affect selection.&quot;,&quot;risk&quot;:&quot;Nausea, sweating, blood-pressure effects and hepatic concerns.&quot;,&quot;extension&quot;:&quot;Pain relief is a direct therapeutic role of monoamine modulation, not merely a secondary result of improved mood.&quot;,&quot;topics&quot;:[&quot;A19&quot;]},&quot;milnacipran&quot;:{&quot;name&quot;:&quot;Milnacipran&quot;,&quot;family&quot;:&quot;snri&quot;,&quot;feature&quot;:&quot;Dual uptake inhibitor; fibromyalgia association&quot;,&quot;explanation&quot;:&quot;Inhibits both serotonin and noradrenaline reuptake, with a relatively strong noradrenergic component. Approved indications vary by region; fibromyalgia is the characteristic US association in the lecture.&quot;,&quot;kinetics&quot;:&quot;A substantial fraction is renally eliminated, distinguishing it from heavily CYP-dependent antidepressants.&quot;,&quot;risk&quot;:&quot;Nausea, sweating, tachycardia and blood-pressure elevation.&quot;,&quot;extension&quot;:&quot;The same pharmacology can be licensed for depression in one jurisdiction and a pain disorder in another; mechanism and indication are separate fields.&quot;,&quot;topics&quot;:[&quot;A19&quot;]},&quot;bupropion&quot;:{&quot;name&quot;:&quot;Bupropion&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;NA/DA enhancement; smoking cessation; seizure risk&quot;,&quot;explanation&quot;:&quot;Inhibits noradrenaline/dopamine reuptake and has nicotinic-receptor antagonist actions relevant to smoking cessation. It is less directly serotonergic than SSRIs, often producing fewer sexual adverse effects.&quot;,&quot;kinetics&quot;:&quot;Active metabolites contribute; CYP2B6 forms hydroxybupropion, while the drug inhibits CYP2D6.&quot;,&quot;risk&quot;:&quot;Dose-related seizure risk, insomnia and hypertension. Seizure and eating-disorder histories are important restrictions.&quot;,&quot;extension&quot;:&quot;A lower sexual-effect burden does not mean uniformly fewer adverse effects; it trades the serotonergic profile for a more activating profile and characteristic seizure risk.&quot;,&quot;topics&quot;:[&quot;A19&quot;]},&quot;trazodone&quot;:{&quot;name&quot;:&quot;Trazodone&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;5-HT₂ blockade; sedation and priapism&quot;,&quot;explanation&quot;:&quot;Combines serotonin-reuptake inhibition with 5-HT₂ antagonism. H₁ and α₁ blockade contribute to sedation and orthostatic hypotension, making the full receptor profile essential.&quot;,&quot;kinetics&quot;:&quot;Hepatic CYP3A metabolism; the dominant clinical effects vary with exposure.&quot;,&quot;risk&quot;:&quot;Sedation, postural hypotension and rare priapism.&quot;,&quot;extension&quot;:&quot;Penile detumescence depends partly on sympathetic α₁-mediated smooth-muscle contraction. Blocking that pathway can contribute to prolonged erection; vascular α₁ blockade similarly impairs standing vasoconstriction.&quot;,&quot;topics&quot;:[&quot;A20&quot;]},&quot;vortioxetine&quot;:{&quot;name&quot;:&quot;Vortioxetine&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;SERT inhibition + multiple serotonin-receptor actions&quot;,&quot;explanation&quot;:&quot;A multimodal antidepressant combining SERT inhibition with actions including 5-HT₁A agonism, 5-HT₁B partial agonism and 5-HT₃/5-HT₇/5-HT₁D antagonism. The net clinical profile cannot be inferred from one receptor alone.&quot;,&quot;kinetics&quot;:&quot;CYP2D6 contributes strongly to metabolism; inhibitors can increase exposure.&quot;,&quot;risk&quot;:&quot;Nausea and serotonergic adverse effects/interactions; sexual effects can still occur.&quot;,&quot;extension&quot;:&quot;Its A20 placement does not mean it lacks reuptake inhibition. Course headings group drugs imperfectly; the actual target profile takes priority.&quot;,&quot;topics&quot;:[&quot;A20&quot;]},&quot;mirtazapine&quot;:{&quot;name&quot;:&quot;Mirtazapine&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;α₂ blockade increases release; sedating H₁ block&quot;,&quot;explanation&quot;:&quot;Blocks presynaptic α₂ autoreceptors/heteroreceptors, removing inhibitory feedback on noradrenaline and serotonin release. It also blocks 5-HT₂, 5-HT₃ and H₁ receptors, shaping both benefit and adverse effects.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism; sustained exposure supports once-daily patterns in common use.&quot;,&quot;risk&quot;:&quot;Sedation, increased appetite and weight gain are prominent.&quot;,&quot;extension&quot;:&quot;Unlike clonidine/dexmedetomidine, which stimulate α₂ and suppress release, mirtazapine blocks α₂ and disinhibits release. Opposite actions at the same receptor explain opposite transmitter effects.&quot;,&quot;topics&quot;:[&quot;A20&quot;]},&quot;mianserin&quot;:{&quot;name&quot;:&quot;Mianserin&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Tetracyclic α₂ antagonist; marrow concern&quot;,&quot;explanation&quot;:&quot;Enhances noradrenergic signalling through α₂ blockade and also has serotonin/H₁ receptor effects. It is related conceptually to mirtazapine but not identical in profile or local availability.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism; sedative effects can be clinically prominent.&quot;,&quot;risk&quot;:&quot;Sedation, weight gain and rare neutropenia/agranulocytosis are important.&quot;,&quot;extension&quot;:&quot;Tetracyclic chemistry does not automatically mean the same transporter blockade as classic TCAs; identify the actual presynaptic receptor action.&quot;,&quot;topics&quot;:[&quot;A20&quot;]},&quot;agomelatine&quot;:{&quot;name&quot;:&quot;Agomelatine&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;MT₁/MT₂ agonism + 5-HT₂C antagonism&quot;,&quot;explanation&quot;:&quot;Combines melatonin-receptor effects on circadian signalling with 5-HT₂C blockade, which can enhance cortical noradrenaline/dopamine release. Used as an antidepressant in relevant settings.&quot;,&quot;kinetics&quot;:&quot;Hepatic CYP1A2 metabolism; liver-function monitoring is part of its clinical identity.&quot;,&quot;risk&quot;:&quot;Hepatotoxicity is the key concern; interactions with strong CYP1A2 inhibitors matter.&quot;,&quot;extension&quot;:&quot;It shares melatonin targets with sleep medicines but adds a serotonin-receptor action, explaining why the antidepressant profile is not simply &#x27;strong melatonin&#x27;.&quot;,&quot;topics&quot;:[&quot;A20&quot;]},&quot;tianeptine&quot;:{&quot;name&quot;:&quot;Tianeptine&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;μ-opioid agonism; dependence liability&quot;,&quot;explanation&quot;:&quot;An antidepressant used in some countries with μ-opioid agonist activity and complex downstream glutamatergic effects. Older teaching as a serotonin-reuptake enhancer is incomplete and should not be treated as the definitive modern mechanism.&quot;,&quot;kinetics&quot;:&quot;Relatively short parent persistence; active-metabolite exposure contributes to its pharmacology.&quot;,&quot;risk&quot;:&quot;Misuse, dependence, withdrawal and opioid-like toxicity at high exposure are important.&quot;,&quot;extension&quot;:&quot;Connect A20 with A11: a medicine labelled &#x27;antidepressant&#x27; can have an opioid-receptor mechanism and corresponding toxicity.&quot;,&quot;topics&quot;:[&quot;A20&quot;]},&quot;esketamine&quot;:{&quot;name&quot;:&quot;Esketamine&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;NMDA antagonist; relatively rapid antidepressant action&quot;,&quot;explanation&quot;:&quot;The S-enantiomer of ketamine blocks NMDA channels. Changes in glutamatergic signalling and downstream synaptic plasticity are implicated in rapid antidepressant effects, although the full causal mechanism remains incompletely established.&quot;,&quot;kinetics&quot;:&quot;Intranasal use in supervised treatment settings; hepatic metabolism forms active metabolites.&quot;,&quot;risk&quot;:&quot;Dissociation, sedation, transient BP elevation and misuse potential; monitoring follows administration.&quot;,&quot;extension&quot;:&quot;A rapid symptom effect differs from conventional monoamine-reuptake adaptation, but does not imply an unsupervised or universally appropriate treatment.&quot;,&quot;topics&quot;:[&quot;A20&quot;]},&quot;hypericum&quot;:{&quot;name&quot;:&quot;Hypericin / Hypericum perforatum&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Herbal antidepressant; enzyme/transporter interactions&quot;,&quot;explanation&quot;:&quot;The workbook names hypericin, a constituent of St John&#x27;s wort. The preparation contains multiple active constituents; effects should not be attributed to hypericin alone.&quot;,&quot;kinetics&quot;:&quot;Hyperforin-containing preparations can induce CYP enzymes and P-glycoprotein, lowering exposure to many other medicines.&quot;,&quot;risk&quot;:&quot;Loss of contraceptive or other drug efficacy and additive serotonergic toxicity are major concerns; photosensitivity can occur.&quot;,&quot;extension&quot;:&quot;This is an example where the named constituent, whole plant preparation and active interaction-producing constituent are not interchangeable concepts.&quot;,&quot;topics&quot;:[&quot;A20&quot;]},&quot;moclobemide&quot;:{&quot;name&quot;:&quot;Moclobemide&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Reversible, preferential MAO-A inhibitor&quot;,&quot;explanation&quot;:&quot;Inhibits monoamine oxidase A, reducing degradation of serotonin, noradrenaline and other monoamines. Reversibility distinguishes it from irreversible MAO inhibitors.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism; inhibition and interaction timing differ from long-lived irreversible enzyme blockade.&quot;,&quot;risk&quot;:&quot;Dangerous serotonin toxicity with incompatible serotonergic drugs. Tyramine interaction risk is reduced compared with irreversible nonselective MAO inhibition, not universally absent.&quot;,&quot;extension&quot;:&quot;Contrast selegiline/rasagiline in A22: enzyme subtype, selectivity and clinical dose determine which monoamine system is most affected.&quot;,&quot;topics&quot;:[&quot;A20&quot;]},&quot;lithium&quot;:{&quot;name&quot;:&quot;Lithium&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Mood stabiliser; renal clearance and narrow range&quot;,&quot;explanation&quot;:&quot;Used for mania and maintenance in bipolar disorder. Effects on inositol signalling, glycogen synthase kinase-3 and downstream plasticity are implicated; no single receptor mechanism fully explains clinical efficacy.&quot;,&quot;kinetics&quot;:&quot;Not metabolised; renal handling follows sodium-related processes. Volume/sodium depletion and several interacting drugs can raise concentration.&quot;,&quot;risk&quot;:&quot;Tremor, hypothyroidism and nephrogenic diabetes insipidus; toxicity can progress to ataxia, confusion and seizures.&quot;,&quot;extension&quot;:&quot;NSAIDs can lower renal lithium clearance through renal haemodynamic effects. A small change in elimination matters because the therapeutic margin is narrow.&quot;,&quot;topics&quot;:[&quot;A20&quot;]},&quot;atypical-class&quot;:{&quot;name&quot;:&quot;Atypical antipsychotics — class entry&quot;,&quot;family&quot;:&quot;antipsychotic&quot;,&quot;feature&quot;:&quot;Bipolar effect depends on drug and episode&quot;,&quot;explanation&quot;:&quot;Selected agents treat acute mania, and some also treat bipolar depression or prevent recurrence. Quetiapine, olanzapine and risperidone have different evidence/indication profiles.&quot;,&quot;kinetics&quot;:&quot;Half-life, active metabolites and depot formulations vary; there is no single class time course.&quot;,&quot;risk&quot;:&quot;Metabolic, motor, endocrine and cardiac burdens vary by agent.&quot;,&quot;extension&quot;:&quot;Link to the individual A18 medicines. &#x27;Mood stabiliser&#x27; is a clinical role rather than one shared receptor mechanism, and lamotrigine is not an acute antimanic substitute.&quot;,&quot;topics&quot;:[&quot;A20&quot;]},&quot;phenytoin&quot;:{&quot;name&quot;:&quot;Phenytoin&quot;,&quot;family&quot;:&quot;sodium&quot;,&quot;feature&quot;:&quot;Saturable metabolism; gingival overgrowth&quot;,&quot;explanation&quot;:&quot;Controls focal and tonic–clonic seizures by limiting repetitive firing. It is not an appropriate treatment for typical absence seizures and may worsen some generalised seizure types.&quot;,&quot;kinetics&quot;:&quot;Capacity-limited metabolism means small dose increases can produce disproportionate concentration rises. High protein binding and enzyme induction complicate interactions.&quot;,&quot;risk&quot;:&quot;Nystagmus, ataxia, gingival overgrowth, hirsutism, serious rash and reproductive risks. Rapid IV administration adds cardiac risk.&quot;,&quot;extension&quot;:&quot;The link to kinetics is concrete: as metabolic capacity approaches saturation, a formerly tolerable increase in dose can become toxic.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;carbamazepine&quot;:{&quot;name&quot;:&quot;Carbamazepine&quot;,&quot;family&quot;:&quot;sodium&quot;,&quot;feature&quot;:&quot;Focal seizures + trigeminal neuralgia; autoinduction&quot;,&quot;explanation&quot;:&quot;Used in focal epilepsy, trigeminal neuralgia and selected bipolar/mania settings. Suppression of repetitive neuronal firing connects seizure control with paroxysmal neuralgic pain.&quot;,&quot;kinetics&quot;:&quot;Induces hepatic enzymes, including its own metabolism; active epoxide metabolite contributes to effects.&quot;,&quot;risk&quot;:&quot;Hyponatraemia, rash including severe cutaneous reactions, blood dyscrasias and interactions. Can worsen absence/myoclonic seizures.&quot;,&quot;extension&quot;:&quot;The same initial dose may produce a different concentration later because clearance changes during treatment—an example of autoinduction.&quot;,&quot;topics&quot;:[&quot;A20&quot;,&quot;A21&quot;]},&quot;oxcarbazepine&quot;:{&quot;name&quot;:&quot;Oxcarbazepine&quot;,&quot;family&quot;:&quot;sodium&quot;,&quot;feature&quot;:&quot;Carbamazepine-related; hyponatraemia prominent&quot;,&quot;explanation&quot;:&quot;A related antiseizure medicine used mainly for focal seizures. It is converted to an active monohydroxy derivative that mediates much of the effect.&quot;,&quot;kinetics&quot;:&quot;Fewer enzyme-induction effects than carbamazepine, but clinically meaningful interactions remain, including with hormonal contraception.&quot;,&quot;risk&quot;:&quot;Hyponatraemia, dizziness, diplopia and rash.&quot;,&quot;extension&quot;:&quot;A chemical refinement may reduce one problem while retaining or increasing another; fewer interactions does not mean lower risk on every axis.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;valproate&quot;:{&quot;name&quot;:&quot;Valproate / valproic acid&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Broad-spectrum antiseizure + antimanic + migraine prevention&quot;,&quot;explanation&quot;:&quot;Has several actions, including modulation of Na⁺-dependent firing and increased GABAergic inhibition; effects on T-type calcium currents are also part of the course model. This broad profile supports multiple seizure types, mania treatment and migraine prevention.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism and high protein binding; enzyme/glucuronidation inhibition can increase other drug exposures, notably lamotrigine.&quot;,&quot;risk&quot;:&quot;Major reproductive/developmental risks, hepatotoxicity, pancreatitis, thrombocytopenia, tremor and weight gain. Hyperammonaemia can cause encephalopathy.&quot;,&quot;extension&quot;:&quot;One broad mechanism profile links A13, A20 and A21. Blocking lamotrigine clearance raises exposure and serious-rash risk; the interaction is pharmacokinetic, not just additive sedation.&quot;,&quot;topics&quot;:[&quot;A13&quot;,&quot;A20&quot;,&quot;A21&quot;]},&quot;lamotrigine&quot;:{&quot;name&quot;:&quot;Lamotrigine&quot;,&quot;family&quot;:&quot;sodium&quot;,&quot;feature&quot;:&quot;Broad seizure role; bipolar depressive-relapse prevention&quot;,&quot;explanation&quot;:&quot;Reduces repetitive firing and glutamate release. In bipolar disorder its strength is maintenance, particularly depressive-episode prevention, rather than rapid control of acute mania.&quot;,&quot;kinetics&quot;:&quot;Glucuronidation eliminates it. Valproate inhibits clearance; enzyme inducers can increase clearance.&quot;,&quot;risk&quot;:&quot;Serious rash, including Stevens–Johnson syndrome/toxic epidermal necrolysis; slow titration and interaction-aware dosing are important.&quot;,&quot;extension&quot;:&quot;An agent can be useful in bipolar maintenance while unsuitable for acute mania. &#x27;Mood stabiliser&#x27; does not make all treatment phases equivalent.&quot;,&quot;topics&quot;:[&quot;A20&quot;,&quot;A21&quot;]},&quot;rufinamide&quot;:{&quot;name&quot;:&quot;Rufinamide&quot;,&quot;family&quot;:&quot;sodium&quot;,&quot;feature&quot;:&quot;Lennox–Gastaut adjunct; QT shortening&quot;,&quot;explanation&quot;:&quot;Prolongs sodium-channel inactivation and reduces sustained repetitive firing. It is recognised as an adjunct in Lennox–Gastaut syndrome rather than a universal first-line antiseizure agent.&quot;,&quot;kinetics&quot;:&quot;Food can affect absorption; metabolism mainly involves hydrolysis rather than extensive CYP oxidation.&quot;,&quot;risk&quot;:&quot;Somnolence, dizziness and QT shortening; familial short-QT syndrome is a key restriction.&quot;,&quot;extension&quot;:&quot;Most cardiac drug warnings concern QT prolongation, so shortening is a useful distinguishing feature rather than a reason to assume cardiac neutrality.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;zonisamide&quot;:{&quot;name&quot;:&quot;Zonisamide&quot;,&quot;family&quot;:&quot;sodium&quot;,&quot;feature&quot;:&quot;Multiple targets; stones and reduced sweating&quot;,&quot;explanation&quot;:&quot;A broad-spectrum agent with sodium-channel and T-type calcium-channel effects; carbonic-anhydrase inhibition contributes to some adverse effects.&quot;,&quot;kinetics&quot;:&quot;Relatively long half-life; renal handling and metabolism affect exposure.&quot;,&quot;risk&quot;:&quot;Kidney stones, metabolic acidosis, reduced sweating/heat intolerance, weight loss and rash.&quot;,&quot;extension&quot;:&quot;Carbonic-anhydrase inhibition links a neuronal medicine to renal bicarbonate handling and urinary chemistry.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;lacosamide&quot;:{&quot;name&quot;:&quot;Lacosamide&quot;,&quot;family&quot;:&quot;sodium&quot;,&quot;feature&quot;:&quot;Enhances slow inactivation; PR prolongation&quot;,&quot;explanation&quot;:&quot;Favours slow sodium-channel inactivation, a useful distinction from the fast-inactivation emphasis of several older agents. Used for focal and selected other seizure indications.&quot;,&quot;kinetics&quot;:&quot;Relatively predictable exposure; renal elimination and some metabolism both contribute.&quot;,&quot;risk&quot;:&quot;Dizziness, ataxia and PR prolongation/atrioventricular conduction concerns.&quot;,&quot;extension&quot;:&quot;A drug can have neuronal selectivity sufficient for useful treatment while still altering cardiac conduction at susceptible exposure.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;ethosuximide&quot;:{&quot;name&quot;:&quot;Ethosuximide&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Narrow-spectrum typical absence treatment&quot;,&quot;explanation&quot;:&quot;Reduces low-threshold T-type calcium current in thalamocortical circuits, interrupting rhythmic burst activity associated with typical absence seizures and approximately 3-Hz spike-and-wave activity.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism and relatively long persistence support maintenance treatment, not emergency convulsive rescue.&quot;,&quot;risk&quot;:&quot;GI upset, fatigue and headache; serious rash or blood dyscrasias are uncommon but important.&quot;,&quot;extension&quot;:&quot;Typical absence is a generalised seizure, not simply a small focal seizure. A patient who also has tonic–clonic seizures may need a broader-spectrum strategy.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;gabapentin&quot;:{&quot;name&quot;:&quot;Gabapentin&quot;,&quot;family&quot;:&quot;gabapentinoid&quot;,&quot;feature&quot;:&quot;Neuropathic pain/focal seizures; saturable absorption&quot;,&quot;explanation&quot;:&quot;Used in focal-seizure adjunct therapy and selected neuropathic pain conditions. Its name should not be used to infer direct GABA-receptor agonism.&quot;,&quot;kinetics&quot;:&quot;Saturable intestinal transport means bioavailability falls as dose rises; eliminated largely unchanged by kidneys.&quot;,&quot;risk&quot;:&quot;Sedation, ataxia, oedema and additive respiratory depression with opioids.&quot;,&quot;extension&quot;:&quot;The newer antiseizure slide&#x27;s α₂δ mechanism takes precedence over older handout wording suggesting simple GABA reuptake inhibition.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;pregabalin&quot;:{&quot;name&quot;:&quot;Pregabalin&quot;,&quot;family&quot;:&quot;gabapentinoid&quot;,&quot;feature&quot;:&quot;More predictable absorption; pain/anxiety uses&quot;,&quot;explanation&quot;:&quot;Used for neuropathic pain and focal-seizure adjunct treatment; generalised anxiety is also an indication in some regions. The molecular target remains α₂δ.&quot;,&quot;kinetics&quot;:&quot;More linear/predictable absorption than gabapentin; predominantly renal elimination without major CYP metabolism.&quot;,&quot;risk&quot;:&quot;Dizziness, somnolence, oedema, weight gain and misuse/dependence potential.&quot;,&quot;extension&quot;:&quot;A favourable CYP-interaction profile does not eliminate pharmacodynamic interactions such as combined opioid respiratory depression.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;phenobarbital&quot;:{&quot;name&quot;:&quot;Phenobarbital&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Barbiturate; long action and enzyme induction&quot;,&quot;explanation&quot;:&quot;Enhances GABA-A channel opening duration, increasing inhibitory signalling. Used for selected seizures, including in particular neonatal settings. At high concentrations barbiturates can produce more direct channel activation.&quot;,&quot;kinetics&quot;:&quot;Long half-life and hepatic enzyme induction contribute to accumulation and numerous interactions.&quot;,&quot;risk&quot;:&quot;Sedation, cognitive impairment, dependence and respiratory depression; abrupt withdrawal can provoke seizures.&quot;,&quot;extension&quot;:&quot;Compare with benzodiazepines: the conventional exam distinction is opening duration versus frequency, with a different overdose margin and no flumazenil reversal.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;primidone&quot;:{&quot;name&quot;:&quot;Primidone&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Active parent + phenobarbital formation&quot;,&quot;explanation&quot;:&quot;An antiseizure agent also used for essential tremor. Both the parent and metabolites contribute; phenobarbital formation explains part, but not all, of the pharmacology.&quot;,&quot;kinetics&quot;:&quot;Converted to phenobarbital and phenylethylmalonamide; prolonged metabolite exposure and enzyme induction matter.&quot;,&quot;risk&quot;:&quot;Sedation, ataxia and intolerance during initiation; barbiturate-related interaction/dependence concerns.&quot;,&quot;extension&quot;:&quot;A prodrug-like contribution does not mean the parent is wholly inactive. Separate intrinsic activity from metabolite-mediated effects.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;vigabatrin&quot;:{&quot;name&quot;:&quot;Vigabatrin&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Irreversible GABA transaminase inhibition; visual-field loss&quot;,&quot;explanation&quot;:&quot;Inhibits the enzyme that degrades GABA, increasing available inhibitory transmitter. Used in selected refractory focal epilepsy and infantile spasms, especially relevant tuberous-sclerosis settings.&quot;,&quot;kinetics&quot;:&quot;Clinical biochemical effect outlasts plasma exposure because recovery requires enzyme replacement; renal elimination matters.&quot;,&quot;risk&quot;:&quot;Potentially permanent concentric visual-field loss is the defining serious hazard.&quot;,&quot;extension&quot;:&quot;This increases GABA by preventing breakdown, unlike phenobarbital/benzodiazepines that amplify the receptor response to released GABA.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;levetiracetam&quot;:{&quot;name&quot;:&quot;Levetiracetam&quot;,&quot;family&quot;:&quot;sv2a&quot;,&quot;feature&quot;:&quot;Broad use; few metabolic interactions&quot;,&quot;explanation&quot;:&quot;Used across several seizure types and as an IV option in appropriate acute settings. Its main recognition target is SV2A rather than a classical sodium channel.&quot;,&quot;kinetics&quot;:&quot;Much is renally eliminated unchanged; limited CYP involvement reduces metabolic interactions.&quot;,&quot;risk&quot;:&quot;Irritability, mood changes or behavioural disturbance can be more important than enzyme interactions.&quot;,&quot;extension&quot;:&quot;A pharmacokinetically convenient drug can still be poorly tolerated psychologically; mechanism and patient response must both be considered.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;brivaracetam&quot;:{&quot;name&quot;:&quot;Brivaracetam&quot;,&quot;family&quot;:&quot;sv2a&quot;,&quot;feature&quot;:&quot;Higher SV2A affinity; focal-seizure role&quot;,&quot;explanation&quot;:&quot;A higher-affinity SV2A ligand than levetiracetam, used particularly in focal-seizure therapy. The shared target does not prove identical tolerability or indications.&quot;,&quot;kinetics&quot;:&quot;Hydrolysis and CYP2C19 contribute to metabolism; it is not simply a renally cleared duplicate of levetiracetam.&quot;,&quot;risk&quot;:&quot;Sedation, dizziness and behavioural/psychiatric adverse effects.&quot;,&quot;extension&quot;:&quot;Affinity is a molecular binding measure. Clinical superiority requires outcome evidence, not merely a larger affinity ratio.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;felbamate&quot;:{&quot;name&quot;:&quot;Felbamate&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Refractory epilepsy; marrow and liver toxicity&quot;,&quot;explanation&quot;:&quot;Multiple actions include NMDA-related inhibition and sodium-channel effects. Reserved for selected refractory cases, including Lennox–Gastaut syndrome, because serious toxicity limits routine use.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism and enzyme interactions affect combined antiseizure therapy.&quot;,&quot;risk&quot;:&quot;Aplastic anaemia and severe liver injury are the distinctive major risks.&quot;,&quot;extension&quot;:&quot;A powerful mechanism can be clinically restricted by rare catastrophic adverse effects; frequency alone does not capture the importance of a risk.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;topiramate&quot;:{&quot;name&quot;:&quot;Topiramate&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Broad targets; cognitive slowing, stones, weight loss&quot;,&quot;explanation&quot;:&quot;Combines Na⁺-channel effects, GABA-A enhancement, reduced AMPA/kainate excitation and carbonic-anhydrase inhibition. Used in epilepsy and migraine prevention.&quot;,&quot;kinetics&quot;:&quot;Substantial renal elimination; higher exposure can alter metabolism of some co-medications.&quot;,&quot;risk&quot;:&quot;Cognitive/word-finding difficulty, paraesthesias, stones, metabolic acidosis, acute angle-closure glaucoma and important reproductive risks.&quot;,&quot;extension&quot;:&quot;Carbonic-anhydrase inhibition explains the acid–base/stone link; broader CNS effects help explain why seizure benefit can coexist with cognitive slowing.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;perampanel&quot;:{&quot;name&quot;:&quot;Perampanel&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Noncompetitive AMPA antagonist; behavioural risk&quot;,&quot;explanation&quot;:&quot;Blocks AMPA glutamate receptors, reducing fast excitatory synaptic transmission. Used as adjunctive treatment for focal and selected generalised tonic–clonic seizures.&quot;,&quot;kinetics&quot;:&quot;Long-lived CYP3A substrate; strong enzyme inducers can reduce exposure. High doses can reduce levonorgestrel exposure.&quot;,&quot;risk&quot;:&quot;Aggression/hostility and other serious behavioural effects, dizziness and falls.&quot;,&quot;extension&quot;:&quot;AMPA and NMDA are different glutamate receptors. Perampanel is not an NMDA antagonist simply because ketamine also reduces glutamatergic signalling.&quot;,&quot;topics&quot;:[&quot;A21&quot;]},&quot;levodopa-carbidopa&quot;:{&quot;name&quot;:&quot;Levodopa + carbidopa&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Brain dopamine precursor + peripheral protection&quot;,&quot;explanation&quot;:&quot;Levodopa crosses the blood–brain barrier via amino-acid transport and is converted into dopamine. Carbidopa inhibits peripheral aromatic L-amino-acid decarboxylase, leaving more levodopa for the brain and reducing peripheral dopamine adverse effects.&quot;,&quot;kinetics&quot;:&quot;Levodopa has short plasma persistence; gastric emptying and dietary amino acids can influence delivery. Carbidopa does not substantially enter the brain.&quot;,&quot;risk&quot;:&quot;Nausea, orthostasis, hallucinations, dyskinesia and motor fluctuations can occur.&quot;,&quot;extension&quot;:&quot;Carbidopa protects delivery; it is not the central dopamine replacement. Continued degeneration and pulsatile delivery help explain wearing-off despite ongoing dosing.&quot;,&quot;topics&quot;:[&quot;A22&quot;]},&quot;levodopa-triple&quot;:{&quot;name&quot;:&quot;Levodopa + carbidopa + entacapone&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Add peripheral COMT inhibition for wearing-off&quot;,&quot;explanation&quot;:&quot;Entacapone inhibits catechol-O-methyltransferase, reducing another peripheral levodopa breakdown route. Together with decarboxylase inhibition, it prolongs levodopa availability and can reduce off periods.&quot;,&quot;kinetics&quot;:&quot;Entacapone is used in relation to levodopa doses; its role depends on the precursor being present.&quot;,&quot;risk&quot;:&quot;Greater dopaminergic exposure can worsen dyskinesia; diarrhoea and urine discolouration are distinguishing effects.&quot;,&quot;extension&quot;:&quot;Improving wearing-off and worsening peak-dose dyskinesia are compatible outcomes of increasing dopaminergic exposure.&quot;,&quot;topics&quot;:[&quot;A22&quot;]},&quot;ropinirole&quot;:{&quot;name&quot;:&quot;Ropinirole&quot;,&quot;family&quot;:&quot;dopamineagonist&quot;,&quot;feature&quot;:&quot;Non-ergot dopamine agonist; CYP1A2 metabolism&quot;,&quot;explanation&quot;:&quot;Directly stimulates D₂-like receptors for Parkinson symptoms and selected restless-legs settings. It can be used with or without levodopa depending on the clinical context.&quot;,&quot;kinetics&quot;:&quot;Hepatic CYP1A2 metabolism; smoking changes or inhibitors can alter exposure.&quot;,&quot;risk&quot;:&quot;Impulse-control disorders, hallucinations, orthostasis and sudden sleep episodes.&quot;,&quot;extension&quot;:&quot;A motor treatment acts in reward and arousal circuits too, explaining why adverse effects can appear behavioural rather than muscular.&quot;,&quot;topics&quot;:[&quot;A22&quot;]},&quot;pramipexole&quot;:{&quot;name&quot;:&quot;Pramipexole&quot;,&quot;family&quot;:&quot;dopamineagonist&quot;,&quot;feature&quot;:&quot;D₃-preferring agonist; renal elimination&quot;,&quot;explanation&quot;:&quot;A non-ergot D₂-family agonist with particular D₃ affinity, used in Parkinson disease and selected restless-legs settings.&quot;,&quot;kinetics&quot;:&quot;Predominantly renal elimination distinguishes it from ropinirole.&quot;,&quot;risk&quot;:&quot;Somnolence, hallucinations, oedema and impulse-control disorders.&quot;,&quot;extension&quot;:&quot;Same clinical family, different clearance: kidney function can change pramipexole exposure without requiring a CYP interaction.&quot;,&quot;topics&quot;:[&quot;A22&quot;]},&quot;selegiline&quot;:{&quot;name&quot;:&quot;Selegiline&quot;,&quot;family&quot;:&quot;maob&quot;,&quot;feature&quot;:&quot;Irreversible MAO-B inhibition; stimulant metabolites&quot;,&quot;explanation&quot;:&quot;At usual Parkinson exposure it preferentially inhibits MAO-B, enhancing available dopamine. Higher exposures or different formulations can broaden pharmacology.&quot;,&quot;kinetics&quot;:&quot;Irreversible enzyme inhibition outlasts plasma drug; metabolism produces amphetamine-related compounds.&quot;,&quot;risk&quot;:&quot;Insomnia, orthostasis and interaction risks; selectivity is not absolute at every dose.&quot;,&quot;extension&quot;:&quot;MAO-B selectivity in Parkinson treatment should not be copied unchanged into a discussion of antidepressant formulations/exposures.&quot;,&quot;topics&quot;:[&quot;A22&quot;]},&quot;rasagiline&quot;:{&quot;name&quot;:&quot;Rasagiline&quot;,&quot;family&quot;:&quot;maob&quot;,&quot;feature&quot;:&quot;MAO-B inhibitor without amphetamine metabolites&quot;,&quot;explanation&quot;:&quot;An irreversible MAO-B inhibitor used for Parkinson symptoms and levodopa-related fluctuations.&quot;,&quot;kinetics&quot;:&quot;Metabolised principally through CYP1A2; unlike selegiline it does not produce amphetamine metabolites.&quot;,&quot;risk&quot;:&quot;Orthostasis, dyskinesia when combined with levodopa and relevant serotonergic/opioid interactions.&quot;,&quot;extension&quot;:&quot;A proposed antioxidant/neuroprotective rationale remains distinct from demonstrated disease modification in patients.&quot;,&quot;topics&quot;:[&quot;A22&quot;]},&quot;amantadine&quot;:{&quot;name&quot;:&quot;Amantadine&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;NMDA-related antidyskinetic effect&quot;,&quot;explanation&quot;:&quot;Used in Parkinson disease, particularly for levodopa-associated dyskinesia. NMDA antagonism contributes, with additional dopaminergic effects historically described.&quot;,&quot;kinetics&quot;:&quot;Predominantly renal elimination; impaired clearance can markedly increase CNS toxicity.&quot;,&quot;risk&quot;:&quot;Confusion, hallucinations, ankle oedema and livedo reticularis, a mottled skin pattern.&quot;,&quot;extension&quot;:&quot;Increasing movement is not the only Parkinson goal: reducing troublesome involuntary movements during treatment may require a different mechanism.&quot;,&quot;topics&quot;:[&quot;A22&quot;]},&quot;procyclidine&quot;:{&quot;name&quot;:&quot;Procyclidine&quot;,&quot;family&quot;:&quot;antimuscarinic&quot;,&quot;feature&quot;:&quot;Central antimuscarinic; workbook retained&quot;,&quot;explanation&quot;:&quot;A central antimuscarinic used for selected parkinsonian tremor and drug-induced movement symptoms. It helps rebalance striatal cholinergic/dopaminergic influences rather than replacing dopamine.&quot;,&quot;kinetics&quot;:&quot;Central penetration is needed for the motor effect.&quot;,&quot;risk&quot;:&quot;Confusion, urinary retention and other antimuscarinic adverse effects limit use, especially with cognitive impairment.&quot;,&quot;extension&quot;:&quot;The 3 November lecturer explicitly replaced procyclidine with biperiden as the compulsory example. It remains visible here because it is present in the supplied workbook.&quot;,&quot;topics&quot;:[&quot;A22&quot;],&quot;focus&quot;:{&quot;type&quot;:&quot;Spoken correction · 3 Nov&quot;,&quot;text&quot;:&quot;The lecturer stated that procyclidine was no longer the compulsory example and substituted biperiden. Procyclidine remains in this map because the supplied workbook still lists it.&quot;}},&quot;biperiden&quot;:{&quot;name&quot;:&quot;Biperiden&quot;,&quot;family&quot;:&quot;antimuscarinic&quot;,&quot;feature&quot;:&quot;Lecturer&#x27;s compulsory central antimuscarinic&quot;,&quot;explanation&quot;:&quot;Used for selected tremor/parkinsonism and acute dystonic reactions from dopamine blockers. Its central antimuscarinic effect reduces striatal cholinergic influence.&quot;,&quot;kinetics&quot;:&quot;Brain penetration enables benefit and central cognitive adverse effects.&quot;,&quot;risk&quot;:&quot;Dry mouth, retention, blurred vision and confusion; antimuscarinics can worsen tardive dyskinesia.&quot;,&quot;extension&quot;:&quot;Acute dystonia and tardive dyskinesia require different reasoning. A drug helpful for the former is not automatically appropriate for the latter.&quot;,&quot;topics&quot;:[&quot;A22&quot;],&quot;focus&quot;:{&quot;type&quot;:&quot;Spoken correction · 3 Nov&quot;,&quot;text&quot;:&quot;The lecturer corrected the opening drug list: biperiden replaces procyclidine as the compulsory central antimuscarinic example. The discussion warned about peripheral antimuscarinic effects and cognitive problems.&quot;}},&quot;memantine&quot;:{&quot;name&quot;:&quot;Memantine&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Uncompetitive NMDA-channel blocker for dementia&quot;,&quot;explanation&quot;:&quot;A voltage-dependent, uncompetitive NMDA antagonist used for symptomatic treatment of moderate-to-severe Alzheimer disease. It limits excessive glutamatergic activation while its kinetics permit more physiological transmission than a simple permanent blockade model suggests.&quot;,&quot;kinetics&quot;:&quot;Substantial renal elimination; kidney function and urine conditions can affect exposure.&quot;,&quot;risk&quot;:&quot;Dizziness, confusion, constipation and gait problems can occur.&quot;,&quot;extension&quot;:&quot;Compare ketamine: sharing an NMDA target does not mean sharing anaesthetic intensity, kinetics or clinical indication.&quot;,&quot;topics&quot;:[&quot;A22&quot;]},&quot;rivastigmine&quot;:{&quot;name&quot;:&quot;Rivastigmine&quot;,&quot;family&quot;:&quot;ache&quot;,&quot;feature&quot;:&quot;AChE + butyrylcholinesterase inhibition&quot;,&quot;explanation&quot;:&quot;A carbamate cholinesterase inhibitor used for symptomatic dementia treatment, including Parkinson-disease dementia in relevant settings. Inhibits both acetylcholinesterase and butyrylcholinesterase.&quot;,&quot;kinetics&quot;:&quot;Enzyme-mediated hydrolysis with limited conventional CYP involvement; transdermal delivery changes exposure and GI tolerability.&quot;,&quot;risk&quot;:&quot;Cholinergic GI effects, weight loss and bradycardia; patches can cause local skin reactions.&quot;,&quot;extension&quot;:&quot;The intended central increase in acetylcholine and unwanted peripheral increase are two locations of the same pharmacology.&quot;,&quot;topics&quot;:[&quot;A22&quot;]},&quot;donepezil&quot;:{&quot;name&quot;:&quot;Donepezil&quot;,&quot;family&quot;:&quot;ache&quot;,&quot;feature&quot;:&quot;Long-acting acetylcholinesterase inhibitor&quot;,&quot;explanation&quot;:&quot;Inhibits acetylcholinesterase to support remaining cholinergic signalling in Alzheimer disease. It is symptomatic rather than a replacement for lost neurons.&quot;,&quot;kinetics&quot;:&quot;Long half-life; CYP2D6/CYP3A metabolism contributes to interactions.&quot;,&quot;risk&quot;:&quot;GI effects, bradycardia/syncope, insomnia or vivid dreams.&quot;,&quot;extension&quot;:&quot;Contrast with memantine: both are cognitive-symptom medicines, but one increases acetylcholine and the other modulates an excitatory glutamate channel.&quot;,&quot;topics&quot;:[&quot;A22&quot;]},&quot;tetrabenazine&quot;:{&quot;name&quot;:&quot;Tetrabenazine&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;VMAT2 inhibition reduces monoamine release&quot;,&quot;explanation&quot;:&quot;Inhibits vesicular monoamine transporter 2, reducing storage and subsequent release of dopamine and other monoamines. This can reduce Huntington chorea, where excessive movement differs from Parkinson hypokinesia.&quot;,&quot;kinetics&quot;:&quot;Active metabolites contribute; CYP2D6 activity and inhibitors affect exposure.&quot;,&quot;risk&quot;:&quot;Depression/suicidality, parkinsonism, sedation and akathisia are key concerns.&quot;,&quot;extension&quot;:&quot;A drug that reduces dopamine can help chorea but worsen bradykinesia. The required direction of treatment follows the circuit disturbance.&quot;,&quot;topics&quot;:[&quot;A22&quot;]},&quot;piracetam&quot;:{&quot;name&quot;:&quot;Piracetam&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Nootropic example; mechanism/evidence limits&quot;,&quot;explanation&quot;:&quot;Listed in the course among nootropics, with proposed membrane and neuronal effects. There is no single well-established receptor mechanism or established disease-modifying Alzheimer benefit to assign confidently.&quot;,&quot;kinetics&quot;:&quot;Largely renal elimination; renal function influences exposure.&quot;,&quot;risk&quot;:&quot;Nervousness, sleep disturbance and bleeding-related cautions can be relevant.&quot;,&quot;extension&quot;:&quot;Its recognised use for cortical myoclonus in some jurisdictions is distinct from broad claims of cognitive enhancement. Preserve uncertainty instead of inventing a precise target.&quot;,&quot;topics&quot;:[&quot;A22&quot;],&quot;focus&quot;:{&quot;type&quot;:&quot;Lecture slides · no precise receptor claim&quot;,&quot;text&quot;:&quot;The deck lists piracetam among nootropics and proposes neuronal/microcirculatory effects. These proposals should not be converted into a proven Alzheimer disease-modifying effect or an invented single receptor mechanism.&quot;}},&quot;nusinersen&quot;:{&quot;name&quot;:&quot;Nusinersen&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;SMN2 splicing modification preserves exon 7&quot;,&quot;explanation&quot;:&quot;An antisense oligonucleotide binds an intronic splice-silencing site in SMN2 pre-mRNA. This promotes exon 7 inclusion, increasing full-length survival motor neuron (SMN) protein in spinal muscular atrophy caused by deficient SMN1 function.&quot;,&quot;kinetics&quot;:&quot;Intrathecal administration gives access to the CNS; loading is followed by maintenance treatment.&quot;,&quot;risk&quot;:&quot;Lumbar-puncture-related symptoms and platelet/coagulation or renal monitoring concerns.&quot;,&quot;extension&quot;:&quot;It is not siRNA and does not destroy the target mRNA. SMN2 is a partly productive backup gene, not simply a nonfunctional pseudogene.&quot;,&quot;topics&quot;:[&quot;A22&quot;],&quot;focus&quot;:{&quot;type&quot;:&quot;Lecture explanation + corrected slide terminology&quot;,&quot;text&quot;:&quot;The spoken explanation described preventing loss of exon 7 from SMN2 mRNA to increase functional protein. The slide labels siRNA and pseudogene are misleading: nusinersen is a splice-modifying antisense oligonucleotide and SMN2 can produce functional protein.&quot;}},&quot;onasemnogene&quot;:{&quot;name&quot;:&quot;Onasemnogene abeparvovec&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;AAV gene delivery supplies functional SMN1&quot;,&quot;explanation&quot;:&quot;An adeno-associated viral vector delivers a functional SMN1 transgene, enabling cells to produce survival motor neuron protein. This addresses the protein deficit through gene delivery rather than changing SMN2 splicing.&quot;,&quot;kinetics&quot;:&quot;A gene-therapy product with eligibility and monitoring requirements; expression persists beyond circulating-vector exposure.&quot;,&quot;risk&quot;:&quot;Serious liver injury, thrombocytopenia and thrombotic microangiopathy are important risks.&quot;,&quot;extension&quot;:&quot;Compare nusinersen: provide a functional gene versus improve processing of an existing backup gene. Neither mechanism restores motor neurons that have already been irreversibly lost.&quot;,&quot;topics&quot;:[&quot;A22&quot;]}},&quot;families&quot;:{&quot;local&quot;:{&quot;name&quot;:&quot;Local Na⁺-channel blockade&quot;,&quot;mechanism&quot;:&quot;Voltage-gated sodium channels carry the inward current that regenerates an action potential along a nerve. Local anaesthetics reduce that current, so a painful stimulus no longer propagates to the spinal cord. Most are weak bases: the uncharged fraction crosses the membrane, then the intracellular charged fraction binds within the channel. Open and inactivated channels are favoured, making block use dependent. Acidic inflamed tissue leaves less uncharged drug outside the axon and often weakens anaesthesia.&quot;,&quot;risk&quot;:&quot;The same channels occur elsewhere. Excess systemic exposure can first produce neurological symptoms and seizures, then cardiac conduction failure or collapse. Local anaesthesia is loss of sensation in a region; it does not require unconsciousness.&quot;},&quot;opioid&quot;:{&quot;name&quot;:&quot;μ-opioid receptor signalling&quot;,&quot;mechanism&quot;:&quot;The μ (mu) opioid receptor is a Gi/o-coupled receptor in brain, spinal cord and peripheral tissues. Presynaptic calcium entry decreases, reducing release of glutamate and substance P; postsynaptic potassium conductance increases, making the neuron harder to excite. These actions reduce pain transmission and change the response to pain. In the brainstem, μ activation also reduces the ventilatory response to carbon dioxide. In enteric neurons, it reduces propulsive movement and secretion.&quot;,&quot;risk&quot;:&quot;Analgesia can therefore accompany respiratory depression, sedation, constipation and dependence. Combining opioids with other sedatives increases respiratory risk. Tolerance develops unevenly: persistent constipation is not evidence that analgesic tolerance has failed to develop.&quot;},&quot;nsaid&quot;:{&quot;name&quot;:&quot;Cyclooxygenase inhibition&quot;,&quot;mechanism&quot;:&quot;In damaged or activated tissue, arachidonic acid is converted by cyclooxygenase (COX) into prostanoid precursors. Inhibiting COX lowers prostaglandin E₂, reducing nociceptor sensitisation and the raised hypothalamic temperature set point. This explains analgesic and antipyretic effects; many agents also suppress inflammation. COX-1 and COX-2 are not simply &#x27;bad&#x27; versus &#x27;good&#x27;: both supply physiological signals in particular tissues.&quot;,&quot;risk&quot;:&quot;Loss of protective gastric prostanoids favours ulceration and bleeding. Loss of renal prostaglandin support can reduce filtration during poor perfusion and cause salt retention. Cardiovascular risk varies by drug and exposure; COX-2 preference does not eliminate renal risk.&quot;},&quot;triptan&quot;:{&quot;name&quot;:&quot;5-HT₁B/₁D agonism&quot;,&quot;mechanism&quot;:&quot;Serotonin is also called 5-hydroxytryptamine (5-HT). Stimulation of 5-HT₁D receptors on trigeminal terminals reduces release of peptides such as calcitonin gene-related peptide (CGRP), reducing nociceptive transmission. 5-HT₁B stimulation can constrict cranial arteries. These Gi/o-linked actions interrupt an acute migraine attack; they do not mean that migraine is only a disease of dilated vessels.&quot;,&quot;risk&quot;:&quot;Vasoconstriction makes coronary and cerebrovascular disease important restrictions. Frequent use of acute headache medicines can itself sustain medication-overuse headache.&quot;},&quot;volatile&quot;:{&quot;name&quot;:&quot;Inhaled general anaesthesia&quot;,&quot;mechanism&quot;:&quot;Inhaled drug passes from alveoli to blood and then brain along partial-pressure gradients. Lower blood solubility usually makes brain partial pressure rise and fall faster. Volatile agents act on several inhibitory and excitatory neuronal targets, including GABA-A and potassium channels; no single receptor explains all effects. Minimum alveolar concentration (MAC) measures the concentration preventing movement in 50% of subjects, so lower MAC means greater potency for that endpoint, not faster induction.&quot;,&quot;risk&quot;:&quot;Dose-dependent hypotension and ventilatory depression can occur. Halogenated volatile agents can trigger malignant hyperthermia in susceptible skeletal muscle. Immobility, amnesia and analgesia are different endpoints, especially if a neuromuscular blocker masks movement.&quot;},&quot;ivgaba&quot;:{&quot;name&quot;:&quot;GABA-A-mediated hypnosis&quot;,&quot;mechanism&quot;:&quot;Gamma-aminobutyric acid (GABA) is released from inhibitory neurons and opens GABA-A ligand-gated chloride channels. Enhancing this conductance generally hyperpolarises or electrically shunts mature neurons, making excitation less effective. In cortical, thalamic and arousal networks, stronger inhibition produces hypnosis and amnesia. It does not automatically block nociceptive processing: a hypnotic can make a person unconscious without supplying adequate analgesia.&quot;,&quot;risk&quot;:&quot;Cardiorespiratory depression depends on the agent, dose and combinations. After a single lipophilic IV bolus, redistribution out of the brain can end the effect before most drug has been eliminated. Flumazenil does not reverse every drug acting at GABA-A receptors.&quot;},&quot;benzo&quot;:{&quot;name&quot;:&quot;Benzodiazepine-site GABA-A modulation&quot;,&quot;mechanism&quot;:&quot;Benzodiazepines bind an allosteric site on suitable GABA-A receptors, distinct from the GABA-binding site. In the presence of GABA they increase the frequency of channel opening, enhancing inhibitory chloride conductance. Different networks account for anxiolysis, sedation, anterograde amnesia, anticonvulsant effects and reduced muscle tone. Anterograde amnesia means impaired formation of new memories after exposure, not reliable removal of memories already formed.&quot;,&quot;risk&quot;:&quot;Sedation, impaired coordination, falls, tolerance and dependence are class effects. Abrupt withdrawal after dependence can cause seizures. Opioids and alcohol markedly increase respiratory risk. Duration depends on redistribution, clearance and active metabolites, not simply on how quickly sleep begins.&quot;},&quot;zdrug&quot;:{&quot;name&quot;:&quot;Non-benzodiazepine GABA-A hypnotic&quot;,&quot;mechanism&quot;:&quot;Z-drugs are chemically different from benzodiazepines but bind the benzodiazepine site on GABA-A receptors and enhance GABA-dependent inhibition. Their useful effect is predominantly sleep promotion. Subtype selectivity differs between drugs and is not absolute. Chemical novelty does not remove the central nervous system consequences of increasing inhibitory signalling.&quot;,&quot;risk&quot;:&quot;Next-day impairment, amnesia, dependence and complex sleep behaviours can occur. Alcohol and other sedatives increase impairment. They should not be treated as interchangeable with the benzodiazepines used for seizure rescue.&quot;},&quot;melatonin&quot;:{&quot;name&quot;:&quot;Melatonin-receptor signalling&quot;,&quot;mechanism&quot;:&quot;MT₁ and MT₂ are melatonin receptors, including in the suprachiasmatic nucleus, the hypothalamic circadian clock. Their activation communicates a biological-night signal and can reduce wake drive or shift circadian timing. Timing of administration matters because the same signal can shift the clock differently at different circadian phases. This is a different mechanism from directly enhancing GABA-A inhibition.&quot;,&quot;risk&quot;:&quot;S

effects create substantial misuse liability.&quot;,&quot;extension&quot;:&quot;The same molecule illustrates two targets: Na⁺ channels explain numbness, whereas catecholamine transporters explain vascular and rewarding effects.&quot;,&quot;topics&quot;:[&quot;A10&quot;]},&quot;procaine&quot;:{&quot;name&quot;:&quot;Procaine&quot;,&quot;family&quot;:&quot;local&quot;,&quot;feature&quot;:&quot;Short-acting ester; poor surface penetration&quot;,&quot;explanation&quot;:&quot;An ester local anaesthetic used as an infiltration/nerve-block example. Poor penetration through intact surfaces makes it a poor choice for surface anaesthesia compared with benzocaine or cocaine.&quot;,&quot;kinetics&quot;:&quot;Rapid plasma cholinesterase hydrolysis contributes to short duration. Ester metabolism can generate para-aminobenzoic acid-related products.&quot;,&quot;risk&quot;:&quot;Allergic reactions are more associated with ester local anaesthetics than with amides. Systemic toxicity remains possible after excessive absorption.&quot;,&quot;extension&quot;:&quot;Do not infer that every drug ending in -caine is suitable for every route. Tissue penetration is as important as channel affinity.&quot;,&quot;topics&quot;:[&quot;A10&quot;]},&quot;benzocaine&quot;:{&quot;name&quot;:&quot;Benzocaine&quot;,&quot;family&quot;:&quot;local&quot;,&quot;feature&quot;:&quot;Topical agent; methaemoglobinaemia&quot;,&quot;explanation&quot;:&quot;A poorly water-soluble ester used on surfaces. Its unusually weak basicity means the usual &#x27;charged inside, uncharged outside&#x27; teaching model for tertiary-amine local anaesthetics needs qualification; it is largely uncharged at physiological pH.&quot;,&quot;kinetics&quot;:&quot;Mainly topical use; systemic exposure varies with dose, surface and formulation.&quot;,&quot;risk&quot;:&quot;Oxidation of haemoglobin iron from Fe²⁺ to Fe³⁺ produces methaemoglobin, which cannot carry oxygen normally. Cyanosis can occur despite oxygen delivery.&quot;,&quot;extension&quot;:&quot;Distinguish failure of nerve conduction, the intended effect, from impaired blood oxygen carriage, the characteristic toxicity.&quot;,&quot;topics&quot;:[&quot;A10&quot;]},&quot;lidocaine&quot;:{&quot;name&quot;:&quot;Lidocaine&quot;,&quot;family&quot;:&quot;local&quot;,&quot;feature&quot;:&quot;Versatile local anaesthetic + class IB antiarrhythmic&quot;,&quot;explanation&quot;:&quot;An amide used in topical, infiltration and regional anaesthesia. In ventricular myocardium, use-dependent Na⁺-channel block also explains class IB antiarrhythmic activity.&quot;,&quot;kinetics&quot;:&quot;Intermediate duration; predominantly hepatic metabolism. Reduced hepatic clearance or high systemic absorption can increase exposure.&quot;,&quot;risk&quot;:&quot;Neurological symptoms and seizures may precede cardiovascular toxicity. The antiarrhythmic role does not make an excessive local-anaesthetic dose harmless to the heart.&quot;,&quot;extension&quot;:&quot;Target continuity connects A10 to cardiology: the same channel family is useful in nerves and selected ventricular arrhythmias, with different clinical administration.&quot;,&quot;topics&quot;:[&quot;A10&quot;]},&quot;bupivacaine&quot;:{&quot;name&quot;:&quot;Bupivacaine&quot;,&quot;family&quot;:&quot;local&quot;,&quot;feature&quot;:&quot;Long block; prominent cardiotoxicity&quot;,&quot;explanation&quot;:&quot;A long-acting amide used in regional techniques including epidural anaesthesia. Strong and persistent cardiac sodium-channel binding makes systemic exposure particularly dangerous.&quot;,&quot;kinetics&quot;:&quot;High protein binding and lipid solubility contribute to long action; hepatic metabolism eliminates absorbed drug.&quot;,&quot;risk&quot;:&quot;Severe conduction disturbances, ventricular arrhythmias and cardiovascular collapse can occur after intravascular exposure. Obstetric use does not imply absence of systemic risk.&quot;,&quot;extension&quot;:&quot;Compare the racemate with levobupivacaine and ropivacaine: lower relative cardiotoxicity is an improvement in margin, not immunity to toxicity.&quot;,&quot;topics&quot;:[&quot;A10&quot;]},&quot;levobupivacaine&quot;:{&quot;name&quot;:&quot;Levobupivacaine&quot;,&quot;family&quot;:&quot;local&quot;,&quot;feature&quot;:&quot;S-enantiomer of bupivacaine&quot;,&quot;explanation&quot;:&quot;The S-enantiomer provides prolonged regional anaesthesia with a lower relative cardiotoxic potential than racemic bupivacaine. It remains a sodium-channel blocker with systemic neurological and cardiac effects.&quot;,&quot;kinetics&quot;:&quot;Long duration and hepatic metabolism resemble the parent drug&#x27;s overall clinical pattern.&quot;,&quot;risk&quot;:&quot;Accidental intravascular administration can still cause serious local-anaesthetic systemic toxicity.&quot;,&quot;extension&quot;:&quot;Stereochemistry changes the interaction with biological targets without changing the basic purpose of the drug; &#x27;levo&#x27; here identifies the selected stereoisomer.&quot;,&quot;topics&quot;:[&quot;A10&quot;]},&quot;ropivacaine&quot;:{&quot;name&quot;:&quot;Ropivacaine&quot;,&quot;family&quot;:&quot;local&quot;,&quot;feature&quot;:&quot;Long-acting amide; less cardiotoxic than bupivacaine&quot;,&quot;explanation&quot;:&quot;An S-enantiomer amide used for peripheral and epidural blocks. It offers prolonged sensory block and, depending on concentration and technique, useful separation of sensory and motor effects.&quot;,&quot;kinetics&quot;:&quot;Predominantly hepatic metabolism. Duration depends on tissue binding, dose and site.&quot;,&quot;risk&quot;:&quot;Less cardiotoxic than bupivacaine in comparative terms, but seizures and cardiovascular collapse remain possible with high systemic exposure.&quot;,&quot;extension&quot;:&quot;Sensory–motor selectivity is relative. Local anaesthetics can block motor fibres at sufficient concentrations; they are not intrinsically pain-fibre-only drugs.&quot;,&quot;topics&quot;:[&quot;A10&quot;]},&quot;articaine&quot;:{&quot;name&quot;:&quot;Articaine&quot;,&quot;family&quot;:&quot;local&quot;,&quot;feature&quot;:&quot;Amide with an extra hydrolysable ester&quot;,&quot;explanation&quot;:&quot;A dental local anaesthetic classified as an amide by its linking group. An additional ester group allows substantial plasma hydrolysis, making it an exception to the simple &#x27;amide means only hepatic metabolism&#x27; rule.&quot;,&quot;kinetics&quot;:&quot;Rapid ester hydrolysis produces an inactive metabolite, alongside other metabolic handling.&quot;,&quot;risk&quot;:&quot;Systemic local-anaesthetic toxicity remains possible; formulation, injection site and dose affect risk.&quot;,&quot;extension&quot;:&quot;Use chemical structure rather than a spelling mnemonic when a classification and the metabolic pathway appear to conflict.&quot;,&quot;topics&quot;:[&quot;A10&quot;]},&quot;morphine&quot;:{&quot;name&quot;:&quot;Morphine&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;Prototype full μ agonist; active renal metabolite&quot;,&quot;explanation&quot;:&quot;A strong opioid analgesic that also produces sedation and central/enteric μ effects. Histamine release can contribute to itching and vasodilation.&quot;,&quot;kinetics&quot;:&quot;Hepatic glucuronidation produces morphine-6-glucuronide, an active metabolite, and other metabolites; impaired renal elimination can prolong toxicity.&quot;,&quot;risk&quot;:&quot;Respiratory depression, constipation and hypotension matter. Renal dysfunction can increase metabolite-related toxicity.&quot;,&quot;extension&quot;:&quot;Tolerance to analgesia does not reliably remove constipation. This creates the rationale for peripheral opioid antagonists in the same topic.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;codeine&quot;:{&quot;name&quot;:&quot;Codeine&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;CYP2D6-dependent morphine formation&quot;,&quot;explanation&quot;:&quot;A weaker opioid used for selected pain and antitussive purposes. Part of its analgesia depends on conversion to morphine, so metabolism can create the active effect rather than simply terminate it.&quot;,&quot;kinetics&quot;:&quot;CYP2D6 activity varies genetically and can be inhibited by drugs such as paroxetine or fluoxetine.&quot;,&quot;risk&quot;:&quot;Poor conversion can reduce analgesia; ultrarapid conversion can increase opioid toxicity. Age and clinical-setting restrictions are important.&quot;,&quot;extension&quot;:&quot;Link to A19: CYP2D6 inhibition may decrease activation of codeine while increasing exposure to an already-active CYP2D6 substrate.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;hydromorphone&quot;:{&quot;name&quot;:&quot;Hydromorphone&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;Potent semisynthetic full μ agonist&quot;,&quot;explanation&quot;:&quot;Used for severe pain. Greater potency than morphine means a smaller mass can produce a comparable effect; it does not mean inherently safer respiratory pharmacology.&quot;,&quot;kinetics&quot;:&quot;Hepatic glucuronidation produces metabolites that can accumulate when renal function is impaired.&quot;,&quot;risk&quot;:&quot;Respiratory depression and constipation persist. Metabolite accumulation can contribute to neuroexcitation, especially in renal impairment.&quot;,&quot;extension&quot;:&quot;Do not equate absence of morphine-6-glucuronide with absence of all renal concerns.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;dihydrocodeine&quot;:{&quot;name&quot;:&quot;Dihydrocodeine&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;Codeine-related weak/moderate opioid&quot;,&quot;explanation&quot;:&quot;A semisynthetic opioid used in analgesia and in some settings cough suppression. The parent drug has activity; its clinical effect should not be reduced to a simple copy of codeine&#x27;s activation model.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism includes CYP2D6 formation of dihydromorphine, with additional pathways.&quot;,&quot;risk&quot;:&quot;Sedation, constipation and respiratory depression can occur; combinations with sedatives increase risk.&quot;,&quot;extension&quot;:&quot;Learn the structural relationship to codeine while retaining the distinction that parent-drug activity and metabolic contributions differ.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;oxycodone&quot;:{&quot;name&quot;:&quot;Oxycodone&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;Active parent drug; CYP interactions&quot;,&quot;explanation&quot;:&quot;A strong semisynthetic μ agonist for severe pain. The parent molecule is active, so it is not merely a prodrug that must be converted to oxymorphone.&quot;,&quot;kinetics&quot;:&quot;Metabolised through CYP3A and CYP2D6 pathways. Strong CYP3A inhibition can increase parent-drug exposure.&quot;,&quot;risk&quot;:&quot;Opioid respiratory depression, constipation and dependence; interaction-related accumulation can intensify these effects.&quot;,&quot;extension&quot;:&quot;Compare with codeine: knowing whether the parent is active is necessary before predicting the result of enzyme inhibition.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;buprenorphine&quot;:{&quot;name&quot;:&quot;Buprenorphine&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;High-affinity partial μ agonist&quot;,&quot;explanation&quot;:&quot;Partial μ efficacy with high receptor affinity supports analgesic and opioid-use-disorder roles. It can displace a full agonist yet provide less receptor activation, precipitating withdrawal in the wrong transition setting.&quot;,&quot;kinetics&quot;:&quot;Slow dissociation and long action vary by formulation. Hepatic metabolism contributes to clearance.&quot;,&quot;risk&quot;:&quot;Respiratory depression remains possible, especially with other depressants. High affinity can make reversal more difficult.&quot;,&quot;extension&quot;:&quot;A ceiling for some effects is not a guarantee of safety. Receptor affinity and intrinsic efficacy are separate properties.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;nalbuphine&quot;:{&quot;name&quot;:&quot;Nalbuphine&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;κ agonism with μ antagonism&quot;,&quot;explanation&quot;:&quot;An opioid analgesic with mixed receptor actions. κ-mediated analgesia coexists with μ-antagonist activity, so the net effect depends on previous opioid exposure.&quot;,&quot;kinetics&quot;:&quot;Parenteral use is common; hepatic metabolism contributes to elimination.&quot;,&quot;risk&quot;:&quot;Can precipitate withdrawal in a person dependent on a μ agonist. Sedation and respiratory effects remain possible.&quot;,&quot;extension&quot;:&quot;&#x27;Mixed agonist–antagonist&#x27; means different actions at different receptors, not an inconsistent drug that randomly changes its mechanism.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;pethidine&quot;:{&quot;name&quot;:&quot;Pethidine (meperidine)&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;Neurotoxic norpethidine metabolite&quot;,&quot;explanation&quot;:&quot;A synthetic μ agonist with additional antimuscarinic properties. Its pupil and heart-rate effects can differ from the classic morphine pattern.&quot;,&quot;kinetics&quot;:&quot;Metabolised to norpethidine (normeperidine), a neuroexcitatory metabolite whose accumulation is favoured by renal impairment or repeated exposure.&quot;,&quot;risk&quot;:&quot;Seizures, serotonergic interactions and opioid respiratory depression limit its usefulness.&quot;,&quot;extension&quot;:&quot;A patient with opioid toxicity need not have pinpoint pupils. Atypical pupil findings should not outweigh depressed consciousness and ventilation.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;fentanyl&quot;:{&quot;name&quot;:&quot;Fentanyl&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;Potent, lipophilic perioperative analgesic&quot;,&quot;explanation&quot;:&quot;A full μ agonist used to supply analgesia during balanced anaesthesia and in other formulation-specific settings. It complements a hypnotic such as propofol; neither drug supplies every component of anaesthesia.&quot;,&quot;kinetics&quot;:&quot;Rapid IV brain entry; early offset after a bolus involves redistribution. Repeated dosing or infusions can lengthen recovery. Mainly CYP3A metabolism.&quot;,&quot;risk&quot;:&quot;Respiratory depression, bradycardia and chest-wall rigidity, particularly with rapid/high exposure. Potentiates benzodiazepine and propofol depression.&quot;,&quot;extension&quot;:&quot;Contrast remifentanil: fentanyl is not cleared by the same rapid nonspecific-esterase mechanism, so &#x27;short acting&#x27; is context dependent.&quot;,&quot;topics&quot;:[&quot;A11&quot;,&quot;A15&quot;]},&quot;remifentanil&quot;:{&quot;name&quot;:&quot;Remifentanil&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;Rapid esterase breakdown; very short offset&quot;,&quot;explanation&quot;:&quot;An ultra-short-acting μ agonist used during anaesthesia when rapid adjustment is useful. Its ester group makes it susceptible to rapid hydrolysis.&quot;,&quot;kinetics&quot;:&quot;Nonspecific blood and tissue esterases produce a short context-sensitive half-time even after infusion; this is not pseudocholinesterase-dependent metabolism.&quot;,&quot;risk&quot;:&quot;Apnoea, bradycardia and rigidity remain possible. Analgesia disappears quickly when the infusion stops.&quot;,&quot;extension&quot;:&quot;Rapid clearance makes recovery controllable but leaves little residual postoperative analgesia; offset is both an advantage and a planning requirement.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;sufentanil&quot;:{&quot;name&quot;:&quot;Sufentanil&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;Very potent fentanyl-family μ agonist&quot;,&quot;explanation&quot;:&quot;A highly potent opioid used in specialist anaesthetic/analgesic settings. Its pharmacological identity is full μ agonism, not a unique receptor family.&quot;,&quot;kinetics&quot;:&quot;High lipophilicity and protein binding; mainly hepatic metabolism. Clinical duration depends on route and administration pattern.&quot;,&quot;risk&quot;:&quot;Profound respiratory depression and rigidity are possible. Potency magnifies the consequences of dose errors.&quot;,&quot;extension&quot;:&quot;Potency compares concentration or dose needed for an effect; it does not establish a greater maximal analgesic benefit.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;methadone&quot;:{&quot;name&quot;:&quot;Methadone&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;Long, variable elimination; QT prolongation&quot;,&quot;explanation&quot;:&quot;A full μ agonist used in opioid-use-disorder maintenance and selected pain settings. Additional NMDA-related and monoamine actions contribute to a complex profile.&quot;,&quot;kinetics&quot;:&quot;Long and variable elimination means repeated doses can accumulate after the apparent analgesic effect has waned.&quot;,&quot;risk&quot;:&quot;Respiratory depression, drug interactions and QT prolongation with torsades risk are major distinctions.&quot;,&quot;extension&quot;:&quot;Duration of analgesia and elimination half-life answer different questions. Re-dosing from pain alone can underestimate residual drug burden.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;tramadol&quot;:{&quot;name&quot;:&quot;Tramadol&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;μ effect + serotonin/NA reuptake inhibition&quot;,&quot;explanation&quot;:&quot;Combines weak μ activity with inhibition of serotonin and noradrenaline reuptake. An active metabolite contributes more strongly to μ effects, while the parent contributes monoaminergic effects.&quot;,&quot;kinetics&quot;:&quot;CYP2D6 forms O-desmethyltramadol; metabolic variation changes the balance of effects.&quot;,&quot;risk&quot;:&quot;Seizures and serotonin toxicity, especially with antidepressants, add to opioid risks.&quot;,&quot;extension&quot;:&quot;Adding an SSRI is not merely adding sedation: it can combine serotonergic mechanisms while altering CYP2D6-dependent activation.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;tapentadol&quot;:{&quot;name&quot;:&quot;Tapentadol&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;μ agonism + chiefly NET inhibition&quot;,&quot;explanation&quot;:&quot;Combines μ-receptor analgesia with noradrenaline reuptake inhibition, strengthening descending inhibitory pain pathways. Serotonin reuptake inhibition is much less prominent than with tramadol.&quot;,&quot;kinetics&quot;:&quot;The parent drug is active; metabolism is mainly conjugation rather than reliance on CYP2D6 activation.&quot;,&quot;risk&quot;:&quot;Respiratory depression, sedation and dependence remain possible; monoaminergic interactions still require attention.&quot;,&quot;extension&quot;:&quot;Compare tramadol by two questions: which transporter is most important, and must metabolism create a major active opioid metabolite?&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;diphenoxylate&quot;:{&quot;name&quot;:&quot;Diphenoxylate&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;Antidiarrhoeal opioid with central liability&quot;,&quot;explanation&quot;:&quot;Enteric μ activity slows propulsive bowel movement and allows more fluid absorption. It is often formulated with a small amount of atropine to discourage excessive use.&quot;,&quot;kinetics&quot;:&quot;Converted to an active metabolite; high exposure can produce central opioid effects.&quot;,&quot;risk&quot;:&quot;Constipation, ileus and opioid toxicity with overdose. It is unsuitable for some infectious or inflammatory diarrhoeal presentations.&quot;,&quot;extension&quot;:&quot;The atropine component does not turn the preparation into an opioid antidote; it adds a different pharmacological effect.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;loperamide&quot;:{&quot;name&quot;:&quot;Loperamide&quot;,&quot;family&quot;:&quot;opioid&quot;,&quot;feature&quot;:&quot;Predominantly peripheral antidiarrhoeal action&quot;,&quot;explanation&quot;:&quot;Activates intestinal opioid receptors to slow transit. At usual exposure, low brain penetration limits the central opioid effects expected from the receptor mechanism.&quot;,&quot;kinetics&quot;:&quot;P-glycoprotein efflux and first-pass handling restrict CNS exposure; these barriers are not unlimited.&quot;,&quot;risk&quot;:&quot;Excessive doses can cause dangerous cardiac arrhythmias and central toxicity. Avoid assuming all diarrhoea should be suppressed.&quot;,&quot;extension&quot;:&quot;Peripheral selectivity here depends strongly on pharmacokinetics rather than an entirely different intestinal μ receptor.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;naloxone&quot;:{&quot;name&quot;:&quot;Naloxone&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Central opioid antagonist; shorter than many opioids&quot;,&quot;explanation&quot;:&quot;Competitively antagonises opioid receptors, especially μ, and can reverse opioid-induced respiratory depression by removing agonist signalling in respiratory circuits. It supplies no analgesia of its own.&quot;,&quot;kinetics&quot;:&quot;Rapid effect by suitable routes; its duration may be shorter than that of the opioid being reversed.&quot;,&quot;risk&quot;:&quot;Recurrent respiratory depression can follow initial improvement. Acute withdrawal and loss of analgesia can occur.&quot;,&quot;extension&quot;:&quot;Contrast methylnaltrexone and naldemedine: a drug designed to remain peripheral is not an equivalent rescue for depressed central breathing.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;methylnaltrexone&quot;:{&quot;name&quot;:&quot;Methylnaltrexone&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Peripheral μ antagonist for constipation&quot;,&quot;explanation&quot;:&quot;Blocks opioid receptors in the gut, restoring motility while usually preserving central analgesia. Its polar quaternary structure restricts brain penetration.&quot;,&quot;kinetics&quot;:&quot;Renal function can affect exposure. Formulations and use differ from emergency naloxone.&quot;,&quot;risk&quot;:&quot;Abdominal pain and diarrhoea can occur; obstruction or vulnerable bowel creates important safety concerns.&quot;,&quot;extension&quot;:&quot;This reverses an unwanted organ effect while preserving another organ&#x27;s desired effect: the location of drug exposure supplies the selectivity.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;naldemedine&quot;:{&quot;name&quot;:&quot;Naldemedine&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Oral peripheral opioid antagonist&quot;,&quot;explanation&quot;:&quot;A peripherally acting μ-opioid receptor antagonist used for opioid-induced constipation. Limited CNS entry helps preserve the analgesic action of the opioid.&quot;,&quot;kinetics&quot;:&quot;Oral administration; CYP3A and P-glycoprotein interactions can affect exposure.&quot;,&quot;risk&quot;:&quot;Abdominal pain and diarrhoea; avoid inappropriate use in suspected bowel obstruction. Withdrawal is possible in susceptible settings.&quot;,&quot;extension&quot;:&quot;Compare the direction of action with loperamide: an enteric agonist slows transit, whereas an enteric antagonist releases opioid-induced slowing.&quot;,&quot;topics&quot;:[&quot;A11&quot;]},&quot;aspirin&quot;:{&quot;name&quot;:&quot;Acetylsalicylic acid (aspirin)&quot;,&quot;family&quot;:&quot;nsaid&quot;,&quot;feature&quot;:&quot;Irreversible platelet COX-1 inhibition&quot;,&quot;explanation&quot;:&quot;Acetylates COX irreversibly. At low doses, platelet thromboxane A₂ falls and aggregation is suppressed; larger exposures produce analgesic, antipyretic and anti-inflammatory actions.&quot;,&quot;kinetics&quot;:&quot;Platelets cannot synthesise new enzyme, so recovery of aggregation depends on platelet renewal over roughly 7–10 days, despite short parent-drug exposure.&quot;,&quot;risk&quot;:&quot;GI bleeding; salicylate toxicity can cause tinnitus and acid–base disturbance. Reye syndrome is the classic association in children with viral illness.&quot;,&quot;extension&quot;:&quot;Irreversibility explains why antiplatelet duration is much longer than the plasma half-life. This is a pharmacodynamic persistence question.&quot;,&quot;topics&quot;:[&quot;A12&quot;]},&quot;naproxen&quot;:{&quot;name&quot;:&quot;Naproxen&quot;,&quot;family&quot;:&quot;nsaid&quot;,&quot;feature&quot;:&quot;Longer-lived propionic-acid NSAID&quot;,&quot;explanation&quot;:&quot;Reversibly inhibits COX to treat inflammatory pain and dysmenorrhoea. The relatively long action distinguishes it from shorter-lived ibuprofen.&quot;,&quot;kinetics&quot;:&quot;Longer elimination half-life supports less frequent administration than short-acting members of the family.&quot;,&quot;risk&quot;:&quot;GI and renal toxicity remain important. A comparatively favourable thrombotic profile in some comparisons is not absence of cardiovascular risk.&quot;,&quot;extension&quot;:&quot;The propionic-acid family groups related chemistry; choose between members using time course and patient risk rather than suffix alone.&quot;,&quot;topics&quot;:[&quot;A12&quot;]},&quot;ibuprofen&quot;:{&quot;name&quot;:&quot;Ibuprofen&quot;,&quot;family&quot;:&quot;nsaid&quot;,&quot;feature&quot;:&quot;Shorter-acting common propionic-acid NSAID&quot;,&quot;explanation&quot;:&quot;Reversible COX inhibition reduces pain, fever and inflammation. It also appears in the gout-flare list and can help close a patent ductus arteriosus in selected neonatal settings.&quot;,&quot;kinetics&quot;:&quot;Relatively short elimination; the racemate includes stereoisomers with different COX activity.&quot;,&quot;risk&quot;:&quot;GI and renal toxicity; timing of use can interfere with low-dose aspirin&#x27;s access to platelet COX.&quot;,&quot;extension&quot;:&quot;An acute gout flare can improve without urate falling: ibuprofen acts on inflammatory mediators, not the urate-production pathway.&quot;,&quot;topics&quot;:[&quot;A12&quot;,&quot;A13&quot;]},&quot;dexibuprofen&quot;:{&quot;name&quot;:&quot;Dexibuprofen&quot;,&quot;family&quot;:&quot;nsaid&quot;,&quot;feature&quot;:&quot;Active S-enantiomer of ibuprofen&quot;,&quot;explanation&quot;:&quot;Contains the S-enantiomer responsible for the principal COX-inhibiting activity. The clinical purpose remains analgesia, antipyresis and suppression of inflammation.&quot;,&quot;kinetics&quot;:&quot;Selection of an active stereoisomer changes dose comparisons; it does not create a new target.&quot;,&quot;risk&quot;:&quot;The usual NSAID gastrointestinal, renal and cardiovascular cautions remain.&quot;,&quot;extension&quot;:&quot;&#x27;Dex-&#x27; is a stereochemical distinction, not proof that the preparation lacks the parent family&#x27;s toxicities.&quot;,&quot;topics&quot;:[&quot;A12&quot;]},&quot;ketoprofen&quot;:{&quot;name&quot;:&quot;Ketoprofen&quot;,&quot;family&quot;:&quot;nsaid&quot;,&quot;feature&quot;:&quot;Propionic-acid NSAID for inflammatory pain&quot;,&quot;explanation&quot;:&quot;A reversible COX inhibitor used for pain and inflammation, including as a course example in acute gout. It does not reduce urate synthesis.&quot;,&quot;kinetics&quot;:&quot;Relatively short-lived compared with naproxen; formulation influences duration.&quot;,&quot;risk&quot;:&quot;GI bleeding, renal injury and photosensitivity with some topical preparations are useful distinctions.&quot;,&quot;extension&quot;:&quot;The treatment goal separates it from allopurinol: suppress today&#x27;s inflammation versus reduce future crystal burden.&quot;,&quot;topics&quot;:[&quot;A12&quot;,&quot;A13&quot;]},&quot;dexketoprofen&quot;:{&quot;name&quot;:&quot;Dexketoprofen&quot;,&quot;family&quot;:&quot;nsaid&quot;,&quot;feature&quot;:&quot;Active S-enantiomer of ketoprofen&quot;,&quot;explanation&quot;:&quot;The active enantiomer supplies COX inhibition for acute pain. Removing the other enantiomer changes the formulation and dose relationship, not the central prostaglandin mechanism.&quot;,&quot;kinetics&quot;:&quot;Often used in short-term pain settings; route/formulation determine onset.&quot;,&quot;risk&quot;:&quot;Retains class GI, renal and cardiovascular risks.&quot;,&quot;extension&quot;:&quot;Compare it with dexibuprofen as another example where stereochemistry helps classify a drug without replacing the mechanism explanation.&quot;,&quot;topics&quot;:[&quot;A12&quot;]},&quot;indomethacin&quot;:{&quot;name&quot;:&quot;Indomethacin&quot;,&quot;family&quot;:&quot;nsaid&quot;,&quot;feature&quot;:&quot;Acute gout + indomethacin-responsive headache&quot;,&quot;explanation&quot;:&quot;A potent COX inhibitor used in acute gout and as a defining treatment response in paroxysmal hemicrania and hemicrania continua. In selected neonates it can promote ductal closure.&quot;,&quot;kinetics&quot;:&quot;Systemic administration and hepatic metabolism; exposure and indication determine the treatment pattern.&quot;,&quot;risk&quot;:&quot;GI and renal toxicity; headache, dizziness and other CNS adverse effects can limit use.&quot;,&quot;extension&quot;:&quot;The same prostaglandin suppression can relieve pain, reduce inflammation and remove a signal maintaining ductus arteriosus patency.&quot;,&quot;topics&quot;:[&quot;A12&quot;,&quot;A13&quot;]},&quot;diclofenac&quot;:{&quot;name&quot;:&quot;Diclofenac&quot;,&quot;family&quot;:&quot;nsaid&quot;,&quot;feature&quot;:&quot;Effective anti-inflammatory; cardiovascular concern&quot;,&quot;explanation&quot;:&quot;An acetic-acid NSAID with substantial anti-inflammatory action and relative COX-2 preference compared with some traditional NSAIDs. Used in musculoskeletal pain and other inflammatory conditions.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism; oral and topical formulations have different systemic exposure.&quot;,&quot;risk&quot;:&quot;Cardiovascular thrombotic risk and hepatic toxicity deserve attention alongside GI/renal effects.&quot;,&quot;extension&quot;:&quot;A drug need not have &#x27;-coxib&#x27; in its name to have meaningful COX-2 preference or cardiovascular risk.&quot;,&quot;topics&quot;:[&quot;A12&quot;]},&quot;meloxicam&quot;:{&quot;name&quot;:&quot;Meloxicam&quot;,&quot;family&quot;:&quot;nsaid&quot;,&quot;feature&quot;:&quot;Oxicam with dose-dependent COX-2 preference&quot;,&quot;explanation&quot;:&quot;An oxicam used for inflammatory joint symptoms. Its COX-2 preference is relative, particularly at lower exposure; it is not identical to a highly selective coxib.&quot;,&quot;kinetics&quot;:&quot;Relatively long action supports once-daily patterns in common formulations.&quot;,&quot;risk&quot;:&quot;Gastric, renal and cardiovascular toxicity can still occur.&quot;,&quot;extension&quot;:&quot;&#x27;-oxicam&#x27; identifies a chemical family; &#x27;-coxib&#x27; identifies a selective COX-2 drug family. The endings do not encode the same classification axis.&quot;,&quot;topics&quot;:[&quot;A12&quot;]},&quot;nimesulide&quot;:{&quot;name&quot;:&quot;Nimesulide&quot;,&quot;family&quot;:&quot;nsaid&quot;,&quot;feature&quot;:&quot;Preferential COX-2 inhibition; liver risk&quot;,&quot;explanation&quot;:&quot;An NSAID with relative COX-2 preference, used in restricted settings in some countries. Its place in the course does not imply unrestricted availability or routine long-term use.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism; duration and indication restrictions are jurisdiction dependent.&quot;,&quot;risk&quot;:&quot;Clinically important hepatotoxicity is a distinguishing concern, plus usual NSAID risks.&quot;,&quot;extension&quot;:&quot;Separate the exam recognition target from current local prescribing rules; country-specific restrictions are not determined by the drug&#x27;s suffix.&quot;,&quot;topics&quot;:[&quot;A12&quot;]},&quot;celecoxib&quot;:{&quot;name&quot;:&quot;Celecoxib&quot;,&quot;family&quot;:&quot;nsaid&quot;,&quot;feature&quot;:&quot;Selective COX-2 inhibitor; no aspirin-like platelet effect&quot;,&quot;explanation&quot;:&quot;COX-2-selective inhibition suppresses inflammatory prostanoids while largely sparing platelet COX-1 at usual exposure. GI ulcer risk is lower than with many traditional NSAIDs, not abolished.&quot;,&quot;kinetics&quot;:&quot;Hepatic CYP2C9 metabolism is a useful interaction link.&quot;,&quot;risk&quot;:&quot;Renal salt retention and cardiovascular thrombotic risk remain; reduced endothelial prostacyclin without equivalent platelet thromboxane suppression helps explain the concern.&quot;,&quot;extension&quot;:&quot;It cannot substitute for aspirin&#x27;s durable antiplatelet action merely because both inhibit cyclooxygenase.&quot;,&quot;topics&quot;:[&quot;A12&quot;]},&quot;phenylbutazone&quot;:{&quot;name&quot;:&quot;Phenylbutazone&quot;,&quot;family&quot;:&quot;nsaid&quot;,&quot;feature&quot;:&quot;Older NSAID with serious marrow toxicity&quot;,&quot;explanation&quot;:&quot;A pyrazolidinedione anti-inflammatory drug retained as a pharmacological comparison. Its toxicity substantially limits modern human use.&quot;,&quot;kinetics&quot;:&quot;Long action and high protein binding favour accumulation and interactions.&quot;,&quot;risk&quot;:&quot;Aplastic anaemia/agranulocytosis, GI injury and fluid retention are major concerns.&quot;,&quot;extension&quot;:&quot;A historically effective anti-inflammatory can become a poor clinical option when safer alternatives are available; efficacy and usefulness are separate judgements.&quot;,&quot;topics&quot;:[&quot;A12&quot;]},&quot;metamizole&quot;:{&quot;name&quot;:&quot;Metamizole (dipyrone)&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Analgesic–antipyretic with spasmolytic action&quot;,&quot;explanation&quot;:&quot;A pyrazolone derivative with strong analgesic and antipyretic actions and relatively weak anti-inflammatory activity. Multiple central/peripheral mechanisms are proposed; a simple selective-COX label is inadequate.&quot;,&quot;kinetics&quot;:&quot;Acts through active metabolites formed after administration.&quot;,&quot;risk&quot;:&quot;Agranulocytosis is the distinctive serious hazard; hypotension and hypersensitivity can occur, especially with parenteral use.&quot;,&quot;extension&quot;:&quot;Its spasmolytic action helps distinguish visceral colicky-pain use from the dominant anti-inflammatory role of many conventional NSAIDs.&quot;,&quot;topics&quot;:[&quot;A12&quot;]},&quot;paracetamol&quot;:{&quot;name&quot;:&quot;Paracetamol (acetaminophen)&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Pain and fever; little peripheral anti-inflammation&quot;,&quot;explanation&quot;:&quot;Reduces pain and fever predominantly through central actions, including prostaglandin-related mechanisms. It has little useful peripheral anti-inflammatory or platelet action at usual exposure.&quot;,&quot;kinetics&quot;:&quot;Most drug is conjugated; a small oxidative pathway forms NAPQI, normally neutralised by glutathione.&quot;,&quot;risk&quot;:&quot;Overdose can exhaust glutathione and allow NAPQI to injure centrilobular hepatocytes. N-acetylcysteine restores detoxifying capacity.&quot;,&quot;extension&quot;:&quot;Compare liver toxicity with aspirin&#x27;s platelet/GI effects. Similar analgesic benefit does not imply the same mechanism of overdose or the same antidote.&quot;,&quot;topics&quot;:[&quot;A12&quot;]},&quot;ketorolac&quot;:{&quot;name&quot;:&quot;Ketorolac&quot;,&quot;family&quot;:&quot;nsaid&quot;,&quot;feature&quot;:&quot;Strong short-term analgesia; GI/renal limits&quot;,&quot;explanation&quot;:&quot;An NSAID used for short-term acute pain, including perioperative settings. Opioid-sparing analgesia can indirectly reduce opioid-related nausea.&quot;,&quot;kinetics&quot;:&quot;Parenteral and oral formulations exist; exposure is restricted to short treatment courses according to product rules.&quot;,&quot;risk&quot;:&quot;GI bleeding and renal injury are major limits.&quot;,&quot;extension&quot;:&quot;It is not a direct antiemetic receptor antagonist. A reduction in vomiting from reduced opioid need differs from metoclopramide&#x27;s central D₂ blockade.&quot;,&quot;topics&quot;:[&quot;A12&quot;]},&quot;aceclofenac&quot;:{&quot;name&quot;:&quot;Aceclofenac&quot;,&quot;family&quot;:&quot;nsaid&quot;,&quot;feature&quot;:&quot;Diclofenac-related anti-inflammatory&quot;,&quot;explanation&quot;:&quot;An acetic-acid NSAID used for musculoskeletal inflammatory pain. Its relationship to diclofenac helps classify it, but clinical effects still require the COX–prostanoid explanation.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism, including active metabolites, contributes to action.&quot;,&quot;risk&quot;:&quot;GI, renal and cardiovascular adverse effects remain relevant.&quot;,&quot;extension&quot;:&quot;A closely related chemical analogue is not automatically free of the cardiovascular concerns of its family.&quot;,&quot;topics&quot;:[&quot;A12&quot;]},&quot;sumatriptan&quot;:{&quot;name&quot;:&quot;Sumatriptan&quot;,&quot;family&quot;:&quot;triptan&quot;,&quot;feature&quot;:&quot;Acute migraine and cluster-attack treatment&quot;,&quot;explanation&quot;:&quot;The prototype triptan. Formulation can make a major difference when rapid relief is needed or vomiting prevents oral use.&quot;,&quot;kinetics&quot;:&quot;Relatively short action; MAO-A contributes to metabolism. Oral and non-oral preparations have different onset.&quot;,&quot;risk&quot;:&quot;Coronary/cerebrovascular contraindications and interactions with other vasoconstrictors matter.&quot;,&quot;extension&quot;:&quot;A rescue medicine stops an attack already underway; it should not be placed in the same branch as daily preventive propranolol.&quot;,&quot;topics&quot;:[&quot;A13&quot;]},&quot;eletriptan&quot;:{&quot;name&quot;:&quot;Eletriptan&quot;,&quot;family&quot;:&quot;triptan&quot;,&quot;feature&quot;:&quot;Oral triptan; CYP3A4 interactions&quot;,&quot;explanation&quot;:&quot;A 5-HT₁B/₁D agonist for acute migraine with the same target logic as sumatriptan. It is not a CGRP antibody or a preventive beta blocker.&quot;,&quot;kinetics&quot;:&quot;CYP3A4 metabolism makes strong enzyme inhibitors an important interaction concern.&quot;,&quot;risk&quot;:&quot;Vasoconstriction-related restrictions and class triptan risks apply.&quot;,&quot;extension&quot;:&quot;An otherwise familiar receptor mechanism can still demand different interaction reasoning because elimination pathways differ.&quot;,&quot;topics&quot;:[&quot;A13&quot;]},&quot;lasmiditan&quot;:{&quot;name&quot;:&quot;Lasmiditan&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;5-HT₁F agonist without triptan-type vasoconstriction&quot;,&quot;explanation&quot;:&quot;Stimulates 5-HT₁F receptors to reduce trigeminal nociceptive signalling. It treats an acute migraine attack without the characteristic 5-HT₁B-mediated vasoconstriction of triptans.&quot;,&quot;kinetics&quot;:&quot;A centrally active oral medicine; pharmacodynamic impairment may outlast the patient&#x27;s subjective feeling of sedation.&quot;,&quot;risk&quot;:&quot;Dizziness and sedation are prominent. Driving restrictions are specified by product information.&quot;,&quot;extension&quot;:&quot;The receptor subtype matters: &#x27;serotonin agonist&#x27; is too broad to predict vascular effects. Less vasoconstriction does not mean no CNS impairment.&quot;,&quot;topics&quot;:[&quot;A13&quot;]},&quot;rimegepant&quot;:{&quot;name&quot;:&quot;Rimegepant&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Small-molecule CGRP receptor antagonist&quot;,&quot;explanation&quot;:&quot;Blocks the receptor for calcitonin gene-related peptide, reducing a trigeminovascular pain signal. Used for both acute treatment and prevention of migraine in appropriate settings.&quot;,&quot;kinetics&quot;:&quot;Oral small molecule; CYP3A/P-glycoprotein interactions affect exposure.&quot;,&quot;risk&quot;:&quot;Hypersensitivity and gastrointestinal adverse effects can occur.&quot;,&quot;extension&quot;:&quot;CGRP&#x27;s canonical receptor includes CLR and RAMP1 and signals chiefly through Gs/cAMP. Rimegepant blocks the receptor; galcanezumab binds the ligand.&quot;,&quot;topics&quot;:[&quot;A13&quot;]},&quot;galcanezumab&quot;:{&quot;name&quot;:&quot;Galcanezumab&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Anti-CGRP ligand antibody for prevention&quot;,&quot;explanation&quot;:&quot;Binds CGRP itself, preventing it from activating its receptors. Long-lasting peptide neutralisation suits prevention rather than immediate titration to a single attack.&quot;,&quot;kinetics&quot;:&quot;Subcutaneous monoclonal antibody with a long half-life; degraded as a protein rather than by conventional CYP metabolism.&quot;,&quot;risk&quot;:&quot;Injection-site reactions and hypersensitivity are important adverse effects.&quot;,&quot;extension&quot;:&quot;Compare molecule size and target: a ligand-binding antibody and a receptor-blocking small molecule intercept the same signalling system in different places.&quot;,&quot;topics&quot;:[&quot;A13&quot;]},&quot;cinnarizine&quot;:{&quot;name&quot;:&quot;Cinnarizine&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;H₁ blockade + calcium-channel effects&quot;,&quot;explanation&quot;:&quot;An antihistaminic drug with calcium-channel effects, included as a regional migraine-preventive and vestibular-symptom example. Its use differs between countries.&quot;,&quot;kinetics&quot;:&quot;Central penetration contributes to sedation; preventive benefit is not an immediate attack-aborting action.&quot;,&quot;risk&quot;:&quot;Somnolence, weight gain and drug-induced parkinsonism are useful distinctions.&quot;,&quot;extension&quot;:&quot;Connect to A22: a medicine used for dizziness or headache can worsen a movement disorder, so symptom labels alone do not establish suitability.&quot;,&quot;topics&quot;:[&quot;A13&quot;]},&quot;propranolol&quot;:{&quot;name&quot;:&quot;Propranolol&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Nonselective β blocker for migraine prevention&quot;,&quot;explanation&quot;:&quot;Blocks β₁ and β₂ receptors and is used to reduce migraine frequency. The preventive mechanism involves more than a simple reduction in meningeal blood flow; beta blockade and central modulation contribute.&quot;,&quot;kinetics&quot;:&quot;Lipophilic, hepatically metabolised drug; preventive benefit requires ongoing treatment.&quot;,&quot;risk&quot;:&quot;Bradycardia, hypotension and bronchospasm in susceptible patients. Abrupt cessation can cause rebound adrenergic effects.&quot;,&quot;extension&quot;:&quot;It can reduce physical adrenergic anxiety symptoms, but that does not make it interchangeable with SSRI treatment of an anxiety disorder.&quot;,&quot;topics&quot;:[&quot;A13&quot;]},&quot;verapamil&quot;:{&quot;name&quot;:&quot;Verapamil&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Cluster-headache prevention; slows AV conduction&quot;,&quot;explanation&quot;:&quot;Blocks L-type calcium channels. In the heart, reduced calcium current slows atrioventricular conduction; in the headache list its distinguishing role is cluster prevention.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism and interaction potential; exposure determines cardiac effects.&quot;,&quot;risk&quot;:&quot;Constipation, bradycardia and conduction block. Cardiac monitoring is relevant when used in cluster-headache regimens.&quot;,&quot;extension&quot;:&quot;Do not substitute it for acute cluster treatment. Prevention and rapid attack termination have different time requirements.&quot;,&quot;topics&quot;:[&quot;A13&quot;]},&quot;colchicine&quot;:{&quot;name&quot;:&quot;Colchicine&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Microtubule inhibition suppresses crystal inflammation&quot;,&quot;explanation&quot;:&quot;Binds tubulin and impairs microtubule assembly, reducing neutrophil migration and crystal-driven inflammatory activity. It treats gout flares and can prevent flares during urate-lowering initiation.&quot;,&quot;kinetics&quot;:&quot;CYP3A4 and P-glycoprotein handle exposure; renal/hepatic dysfunction and inhibitors can produce dangerous accumulation.&quot;,&quot;risk&quot;:&quot;Diarrhoea is common; severe toxicity includes marrow suppression, neuromuscular injury and multiorgan failure.&quot;,&quot;extension&quot;:&quot;It suppresses the inflammatory response to crystals without directly reducing urate concentration. That explains both benefit during a flare and limited effect on long-term crystal burden.&quot;,&quot;topics&quot;:[&quot;A13&quot;]},&quot;allopurinol&quot;:{&quot;name&quot;:&quot;Allopurinol&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Xanthine oxidase inhibition; active oxypurinol&quot;,&quot;explanation&quot;:&quot;Reduces conversion of hypoxanthine/xanthine into urate. Sustained urate lowering promotes gradual dissolution of deposits and prevents future gout, rather than directly numbing an acutely inflamed joint.&quot;,&quot;kinetics&quot;:&quot;Converted to active oxypurinol; renal handling is important for exposure.&quot;,&quot;risk&quot;:&quot;Severe hypersensitivity/skin reactions are important. Inhibition of thiopurine breakdown creates a major interaction with azathioprine or mercaptopurine.&quot;,&quot;extension&quot;:&quot;Mobilisation of deposits can initially provoke flares even while the long-term treatment is working; anti-inflammatory prophylaxis addresses a different process.&quot;,&quot;topics&quot;:[&quot;A13&quot;]},&quot;febuxostat&quot;:{&quot;name&quot;:&quot;Febuxostat&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Non-purine xanthine oxidase inhibitor&quot;,&quot;explanation&quot;:&quot;Lowers urate production by inhibiting xanthine oxidase. It is a urate-lowering drug, not an acute anti-inflammatory substitute for colchicine.&quot;,&quot;kinetics&quot;:&quot;Hepatic and renal pathways contribute; it differs structurally from allopurinol.&quot;,&quot;risk&quot;:&quot;Hepatic adverse effects, serious skin reactions and cardiovascular safety concerns affect selection. The thiopurine interaction also applies.&quot;,&quot;extension&quot;:&quot;Allopurinol and febuxostat share an enzyme target despite different chemistry; structural difference does not remove a target-mediated interaction.&quot;,&quot;topics&quot;:[&quot;A13&quot;]},&quot;rasburicase&quot;:{&quot;name&quot;:&quot;Rasburicase&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Uricase removes existing urate rapidly&quot;,&quot;explanation&quot;:&quot;Recombinant urate oxidase converts urate to more soluble allantoin. The key clinical context is acute hyperuricaemia in tumour lysis rather than routine chronic-gout prevention.&quot;,&quot;kinetics&quot;:&quot;An administered enzyme with rapid biochemical action; handling of blood samples can matter because urate can continue to be degraded outside the body.&quot;,&quot;risk&quot;:&quot;Hydrogen peroxide generation can cause haemolysis and methaemoglobinaemia, particularly in G6PD deficiency; hypersensitivity is possible.&quot;,&quot;extension&quot;:&quot;Compare three levels: colchicine suppresses crystal inflammation, allopurinol prevents new urate formation, and rasburicase degrades urate already present.&quot;,&quot;topics&quot;:[&quot;A13&quot;]},&quot;nitrous-oxide&quot;:{&quot;name&quot;:&quot;Nitrous oxide&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Good analgesia; weak sole anaesthetic&quot;,&quot;explanation&quot;:&quot;Important NMDA-related inhibition contributes to analgesia. Its MAC exceeds 100% at normal atmospheric pressure, so adequate oxygen cannot be supplied while using it alone to achieve 1 MAC.&quot;,&quot;kinetics&quot;:&quot;Low blood solubility produces rapid onset/offset. It enters closed gas spaces faster than nitrogen leaves.&quot;,&quot;risk&quot;:&quot;Can expand a pneumothorax or other trapped gas space; rapid washout can dilute alveolar oxygen. Repeated/prolonged exposure can inactivate vitamin B₁₂-dependent metabolism.&quot;,&quot;extension&quot;:&quot;Low blood solubility predicts speed, not high potency. Nitrous oxide does not trigger malignant hyperthermia, unlike halogenated volatile agents.&quot;,&quot;topics&quot;:[&quot;A14&quot;]},&quot;xenon&quot;:{&quot;name&quot;:&quot;Xenon&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Noble gas; rapid kinetics with NMDA effects&quot;,&quot;explanation&quot;:&quot;An inert noble gas with anaesthetic actions that include inhibition of NMDA-mediated transmission. It is chemically inorganic, despite inconsistent placement in some classification slides.&quot;,&quot;kinetics&quot;:&quot;Very low blood solubility supports rapid induction and emergence; specialised delivery and cost limit use.&quot;,&quot;risk&quot;:&quot;Anaesthetic administration still requires oxygenation and airway management. It is not a malignant-hyperthermia trigger.&quot;,&quot;extension&quot;:&quot;A gas can be chemically unreactive yet pharmacologically active through physical interactions with neuronal proteins.&quot;,&quot;topics&quot;:[&quot;A14&quot;]},&quot;isoflurane&quot;:{&quot;name&quot;:&quot;Isoflurane&quot;,&quot;family&quot;:&quot;volatile&quot;,&quot;feature&quot;:&quot;Pungent volatile; mainly maintenance&quot;,&quot;explanation&quot;:&quot;Provides controllable general anaesthesia, usually during maintenance. Airway irritation makes inhalational induction less attractive even though induction is pharmacologically possible.&quot;,&quot;kinetics&quot;:&quot;More blood soluble than sevoflurane or desflurane; very little metabolism.&quot;,&quot;risk&quot;:&quot;Hypotension and airway irritation; malignant-hyperthermia risk. Low metabolism does not eliminate all organ injury risks from hypotension or other causes.&quot;,&quot;extension&quot;:&quot;The teacher stressed learning its maintenance role. Bronchodilation in lower airways can coexist with irritation of upper airways.&quot;,&quot;topics&quot;:[&quot;A14&quot;]},&quot;desflurane&quot;:{&quot;name&quot;:&quot;Desflurane&quot;,&quot;family&quot;:&quot;volatile&quot;,&quot;feature&quot;:&quot;Very rapid adjustment; airway irritation&quot;,&quot;explanation&quot;:&quot;Low blood solubility permits rapid changes in anaesthetic depth and emergence. Pungency limits its attractiveness for inhalational induction, particularly in children.&quot;,&quot;kinetics&quot;:&quot;Very low blood:gas coefficient, about 0.42 in the lecture; minimal metabolism.&quot;,&quot;risk&quot;:&quot;Coughing/laryngospasm and sympathetic activation with rapid concentration increases; standard volatile cardiorespiratory and malignant-hyperthermia risks.&quot;,&quot;extension&quot;:&quot;The fastest equilibration is not automatically the best induction experience. Physical kinetics and airway tolerability are separate selection axes.&quot;,&quot;topics&quot;:[&quot;A14&quot;]},&quot;sevoflurane&quot;:{&quot;name&quot;:&quot;Sevoflurane&quot;,&quot;family&quot;:&quot;volatile&quot;,&quot;feature&quot;:&quot;Low airway irritation; paediatric induction&quot;,&quot;explanation&quot;:&quot;Relatively nonpungent, making it useful for inhalational induction as well as maintenance. The lecture emphasises this contrast with isoflurane/desflurane.&quot;,&quot;kinetics&quot;:&quot;Low blood solubility supports rapid control; more metabolism than isoflurane/desflurane.&quot;,&quot;risk&quot;:&quot;Hypotension, respiratory depression and malignant hyperthermia remain possible. Compound A formation depends on anaesthetic-circuit conditions.&quot;,&quot;extension&quot;:&quot;Low irritation means smoother gas administration, not absence of respiratory depression or a guarantee against all renal injury.&quot;,&quot;topics&quot;:[&quot;A14&quot;]},&quot;thiopental&quot;:{&quot;name&quot;:&quot;Thiopental&quot;,&quot;family&quot;:&quot;ivgaba&quot;,&quot;feature&quot;:&quot;Redistribution ends a single bolus effect&quot;,&quot;explanation&quot;:&quot;An ultra-short-acting barbiturate used for induction. Barbiturate enhancement of GABA-A inhibition produces hypnosis with no meaningful analgesia. It reduces cerebral metabolism and intracranial pressure in appropriate circumstances.&quot;,&quot;kinetics&quot;:&quot;Rapid brain entry, followed by redistribution into other tissues. Repeated dosing fills tissue stores and prolongs recovery; hepatic elimination is slower than the initial clinical offset.&quot;,&quot;risk&quot;:&quot;Hypotension, apnoea and severe injury after accidental intra-arterial injection. Acute porphyrias are an important restriction.&quot;,&quot;extension&quot;:&quot;A short first effect does not equal a short elimination half-life. Enzyme induction is a repeated-exposure adaptation, not an immediate result of one injection.&quot;,&quot;topics&quot;:[&quot;A15&quot;],&quot;focus&quot;:{&quot;type&quot;:&quot;Spoken lecture · 27 Oct&quot;,&quot;text&quot;:&quot;The teacher identified thiopental as obligatory, emphasised no analgesia and no specific antagonist, and explicitly linked rapid recovery after one dose to redistribution. Repeated doses were contrasted with tissue accumulation.&quot;}},&quot;propofol&quot;:{&quot;name&quot;:&quot;Propofol&quot;,&quot;family&quot;:&quot;ivgaba&quot;,&quot;feature&quot;:&quot;Rapid hypnosis + antiemesis; no analgesia&quot;,&quot;explanation&quot;:&quot;A widely used IV induction and maintenance agent, also used for appropriate procedural/ICU sedation. GABA-A positive modulation is the main exam mechanism; the lipid emulsion accounts for its milky appearance.&quot;,&quot;kinetics&quot;:&quot;Rapid distribution and substantial metabolic clearance support recovery; it can be used in total intravenous anaesthesia, combined with drugs supplying other required effects.&quot;,&quot;risk&quot;:&quot;Hypotension, apnoea and injection pain. Propofol infusion syndrome can involve metabolic acidosis, rhabdomyolysis and cardiovascular failure during susceptible prolonged/high exposure.&quot;,&quot;extension&quot;:&quot;Vasodilation and depressed sympathetic/baroreflex responses explain why marked hypotension need not produce a strong compensatory tachycardia.&quot;,&quot;topics&quot;:[&quot;A15&quot;],&quot;focus&quot;:{&quot;type&quot;:&quot;Spoken lecture · 27 Oct&quot;,&quot;text&quot;:&quot;The teacher stressed no analgesia, antiemetic activity, the milky lipid emulsion, rapid induction, ICU sedation and total intravenous anaesthesia. Hypotension and propofol infusion syndrome were specifically discussed.&quot;}},&quot;etomidate&quot;:{&quot;name&quot;:&quot;Etomidate&quot;,&quot;family&quot;:&quot;ivgaba&quot;,&quot;feature&quot;:&quot;Relative cardiovascular stability; adrenal suppression&quot;,&quot;explanation&quot;:&quot;A rapidly acting induction drug with comparatively little circulatory depression. It supplies hypnosis without analgesia, so the anaesthetic plan must address pain separately.&quot;,&quot;kinetics&quot;:&quot;Short clinical action after induction, but inhibition of adrenal 11β-hydroxylase can suppress cortisol for hours.&quot;,&quot;risk&quot;:&quot;Myoclonus, nausea/vomiting and injection pain; adrenal suppression limits continuous maintenance use.&quot;,&quot;extension&quot;:&quot;The endocrine effect can outlast hypnosis. A short anaesthetic effect therefore does not mean all pharmacological effects have ended.&quot;,&quot;topics&quot;:[&quot;A15&quot;],&quot;focus&quot;:{&quot;type&quot;:&quot;Spoken lecture · 27 Oct&quot;,&quot;text&quot;:&quot;The teacher contrasted cardiovascular stability with propofol/thiopental and highlighted cortisol suppression and its induction role. The slide explicitly warns against maintenance use; endocrine suppression can follow an induction dose.&quot;}},&quot;ketamine&quot;:{&quot;name&quot;:&quot;Ketamine&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Dissociation + substantial analgesia&quot;,&quot;explanation&quot;:&quot;Blocks NMDA glutamate channels, reducing excitatory signalling and producing dissociative anaesthesia. It can provide analgesia at lower exposure than that required for anaesthesia. Unlike the main GABAergic induction agents, it generally stimulates circulation and dilates bronchi.&quot;,&quot;kinetics&quot;:&quot;Can be given IV or IM; hepatic metabolism forms active norketamine. Onset depends on route—IM onset is not instantaneous.&quot;,&quot;risk&quot;:&quot;Emergence hallucinations, salivation, nausea and increased blood pressure. Respiratory depression or laryngospasm can still occur; preserved reflexes do not guarantee airway protection.&quot;,&quot;extension&quot;:&quot;The lecture highlighted IM use and analgesia. It provides no reliable muscle relaxation; benzodiazepines may reduce emergence reactions but are not mandatory in every use.&quot;,&quot;topics&quot;:[&quot;A15&quot;],&quot;focus&quot;:{&quot;type&quot;:&quot;Spoken lecture · 27 Oct&quot;,&quot;text&quot;:&quot;The teacher explicitly highlighted significant analgesia and both IV and intramuscular administration. Dissociation, circulatory stimulation, bronchodilation, increased salivation and lack of muscle relaxation were contrasted with the other IV agents.&quot;}},&quot;dexmedetomidine&quot;:{&quot;name&quot;:&quot;Dexmedetomidine&quot;,&quot;family&quot;:&quot;alpha2&quot;,&quot;feature&quot;:&quot;Arousable sedation with sympatholysis&quot;,&quot;explanation&quot;:&quot;A selective α₂ agonist used for sedation and as an anaesthetic adjunct. It can reduce opioid/anaesthetic requirements and is often associated with an arousable, sleep-like sedative state.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism; infusion conditions and duration affect the clinical response.&quot;,&quot;risk&quot;:&quot;Bradycardia and hypotension are prominent; rapid loading can transiently increase blood pressure through peripheral effects.&quot;,&quot;extension&quot;:&quot;Its main target is a G-protein-coupled adrenergic receptor, not the GABA-A chloride channel. Sedation can be achieved by reducing wake-promoting noradrenaline release.&quot;,&quot;topics&quot;:[&quot;A15&quot;]},&quot;metoclopramide&quot;:{&quot;name&quot;:&quot;Metoclopramide&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Antiemetic D₂ blockade + prokinetic action&quot;,&quot;explanation&quot;:&quot;D₂ antagonism in the chemoreceptor trigger zone reduces emetic signalling. Enteric effects, including enhanced cholinergic activity and 5-HT₄ stimulation, promote upper-GI motility and gastric emptying.&quot;,&quot;kinetics&quot;:&quot;Central penetration allows both antiemetic benefit and central adverse effects; renal impairment can increase exposure.&quot;,&quot;risk&quot;:&quot;Acute dystonia, akathisia and hyperprolactinaemia follow dopamine blockade. Longer exposure can produce tardive dyskinesia.&quot;,&quot;extension&quot;:&quot;Connect A15 with A18: the same D₂ blockade can prevent vomiting, disturb movement and remove tonic inhibition of prolactin, depending on location.&quot;,&quot;topics&quot;:[&quot;A15&quot;]},&quot;atropine&quot;:{&quot;name&quot;:&quot;Atropine&quot;,&quot;family&quot;:&quot;antimuscarinic&quot;,&quot;feature&quot;:&quot;Blocks vagal bradycardia and secretions&quot;,&quot;explanation&quot;:&quot;In perioperative care its relevant actions are blockade of cardiac vagal effects and reduction of secretions. It does not induce anaesthesia or directly reverse nicotinic neuromuscular block.&quot;,&quot;kinetics&quot;:&quot;A tertiary amine that can enter the brain; effects vary with route and exposure.&quot;,&quot;risk&quot;:&quot;Tachycardia, urinary retention, dry mouth and central confusion at excessive exposure.&quot;,&quot;extension&quot;:&quot;When neostigmine increases acetylcholine to reverse suitable muscle blockade, atropine counteracts unwanted muscarinic effects; it does not supply the muscle-block reversal itself.&quot;,&quot;topics&quot;:[&quot;A15&quot;]},&quot;antacids&quot;:{&quot;name&quot;:&quot;Antacids — class entry&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Neutralise existing gastric acid&quot;,&quot;explanation&quot;:&quot;Antacids chemically neutralise acid already present in the gastric lumen. In selected perioperative contexts, nonparticulate preparations can reduce acidity if aspiration occurs. This differs from suppressing acid secretion.&quot;,&quot;kinetics&quot;:&quot;Act locally in the stomach; duration depends on preparation and gastric emptying.&quot;,&quot;risk&quot;:&quot;Electrolyte/metabolic effects depend on the salt. Particulate material and aspiration risk make preparation choice important.&quot;,&quot;extension&quot;:&quot;Famotidine is an H₂ blocker, not an antacid. Metoclopramide changes motility. These are three different ways of modifying gastric risk.&quot;,&quot;topics&quot;:[&quot;A15&quot;]},&quot;antihistamines&quot;:{&quot;name&quot;:&quot;Antihistamines — class entry&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Sedating H₁ blockade; members differ&quot;,&quot;explanation&quot;:&quot;First-generation H₁ antagonists/inverse agonists can enter the brain and reduce histaminergic wake drive. Some also reduce vestibular nausea. Their antimuscarinic actions contribute both useful and adverse effects.&quot;,&quot;kinetics&quot;:&quot;Brain penetration distinguishes many older sedating agents from less-sedating newer antihistamines.&quot;,&quot;risk&quot;:&quot;Drowsiness, impaired driving and anticholinergic effects. Tolerance to sedative effects can develop.&quot;,&quot;extension&quot;:&quot;The A15/A17 workbook gives a class rather than a named drug; do not assume every antihistamine is a useful hypnotic or perioperative antiemetic.&quot;,&quot;topics&quot;:[&quot;A15&quot;,&quot;A17&quot;]},&quot;pain-relievers&quot;:{&quot;name&quot;:&quot;Pain relievers — class entry&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Match analgesic mechanism to pain&quot;,&quot;explanation&quot;:&quot;Perioperative analgesia can combine opioids, non-opioid analgesics and local/regional anaesthesia. Opioids alter central/enteric μ signalling, NSAIDs reduce prostaglandin-dependent sensitisation, and local anaesthetics stop nerve conduction.&quot;,&quot;kinetics&quot;:&quot;Onset and duration must match the procedure and recovery period; there is no single class half-life.&quot;,&quot;risk&quot;:&quot;Each component retains its characteristic toxicities; combining complementary mechanisms can reduce the exposure needed to any one drug.&quot;,&quot;extension&quot;:&quot;This workbook entry links to A10, A11, A12 and selected A21 agents. It is a role, not a single pharmacological receptor family.&quot;,&quot;topics&quot;:[&quot;A15&quot;]},&quot;diazepam&quot;:{&quot;name&quot;:&quot;Diazepam&quot;,&quot;family&quot;:&quot;benzo&quot;,&quot;feature&quot;:&quot;Rapid brain entry; long-lived metabolites&quot;,&quot;explanation&quot;:&quot;Used for acute seizures, anxiety, muscle spasm and alcohol-withdrawal settings. Lipophilicity permits rapid CNS entry by appropriate routes, while persistent metabolites explain prolonged residual effects.&quot;,&quot;kinetics&quot;:&quot;Hepatic oxidation forms active metabolites, including desmethyldiazepam, with long persistence.&quot;,&quot;risk&quot;:&quot;Accumulation, daytime sedation and falls; respiratory risk increases with opioids/alcohol.&quot;,&quot;extension&quot;:&quot;Fast onset and long elimination can coexist. Redistribution can end an initial IV effect while active drug/metabolites remain in the body.&quot;,&quot;topics&quot;:[&quot;A16&quot;,&quot;A21&quot;]},&quot;nitrazepam&quot;:{&quot;name&quot;:&quot;Nitrazepam&quot;,&quot;family&quot;:&quot;benzo&quot;,&quot;feature&quot;:&quot;Longer-acting hypnotic; next-day sedation&quot;,&quot;explanation&quot;:&quot;A benzodiazepine used primarily as a hypnotic in the course classification. Sleep-promoting effects arise from GABA-A enhancement, not a melatonin-clock mechanism.&quot;,&quot;kinetics&quot;:&quot;Relatively long elimination promotes residual daytime effects, particularly with repeated exposure.&quot;,&quot;risk&quot;:&quot;Next-day psychomotor impairment, falls and dependence.&quot;,&quot;extension&quot;:&quot;A drug effective at maintaining sleep can be less attractive when morning alertness is the priority; duration is a practical discriminator within the same receptor class.&quot;,&quot;topics&quot;:[&quot;A16&quot;]},&quot;midazolam&quot;:{&quot;name&quot;:&quot;Midazolam&quot;,&quot;family&quot;:&quot;benzo&quot;,&quot;feature&quot;:&quot;Procedural sedation + anterograde amnesia&quot;,&quot;explanation&quot;:&quot;Used for premedication, procedural sedation and seizure rescue by appropriate routes. It reduces anxiety and memory formation, but supplies no reliable analgesia.&quot;,&quot;kinetics&quot;:&quot;Shorter action after a single administration than diazepam; CYP3A metabolism and active-metabolite accumulation can prolong effects in susceptible patients.&quot;,&quot;risk&quot;:&quot;Respiratory depression, especially with opioids, and accumulation during prolonged use or impaired clearance.&quot;,&quot;extension&quot;:&quot;Being unable to remember a painful event is not the same as receiving analgesia. This explains the role of separate pain control in balanced anaesthesia.&quot;,&quot;topics&quot;:[&quot;A15&quot;,&quot;A16&quot;,&quot;A21&quot;],&quot;focus&quot;:{&quot;type&quot;:&quot;Course focus · seminars and anaesthesia lecture&quot;,&quot;text&quot;:&quot;The anaesthesia lecturer selected midazolam as a short-acting premedication benzodiazepine and mentioned flumazenil. The seminar handout links it to amnesia, hypnotic/premedication roles and relevant seizure uses. Amnesia does not supply analgesia.&quot;}},&quot;alprazolam&quot;:{&quot;name&quot;:&quot;Alprazolam&quot;,&quot;family&quot;:&quot;benzo&quot;,&quot;feature&quot;:&quot;Anxiety/panic use; withdrawal liability&quot;,&quot;explanation&quot;:&quot;A benzodiazepine associated with anxiety and panic indications. Rapid symptomatic relief contrasts with the delayed therapeutic adaptation of SSRIs/SNRIs.&quot;,&quot;kinetics&quot;:&quot;CYP3A metabolism; shorter persistence than very long-lived diazepam metabolites can make falling exposure clinically noticeable.&quot;,&quot;risk&quot;:&quot;Dependence, rebound anxiety and withdrawal symptoms after abrupt discontinuation.&quot;,&quot;extension&quot;:&quot;Rapid relief can be useful, but it does not treat every long-term driver of an anxiety disorder or make indefinite escalation appropriate.&quot;,&quot;topics&quot;:[&quot;A16&quot;]},&quot;clonazepam&quot;:{&quot;name&quot;:&quot;Clonazepam&quot;,&quot;family&quot;:&quot;benzo&quot;,&quot;feature&quot;:&quot;Long-acting anticonvulsant benzodiazepine&quot;,&quot;explanation&quot;:&quot;Used in selected seizure syndromes and panic disorders. GABA-A potentiation explains both antiseizure activity and sedation.&quot;,&quot;kinetics&quot;:&quot;Relatively long duration; hepatic metabolism. Anticonvulsant tolerance can limit sustained benefit.&quot;,&quot;risk&quot;:&quot;Sedation, impaired coordination, dependence and withdrawal seizures.&quot;,&quot;extension&quot;:&quot;It appears in A16 and A21 because one molecular action can serve two clinical roles. The map keeps one explanation linked to both topics.&quot;,&quot;topics&quot;:[&quot;A16&quot;,&quot;A21&quot;]},&quot;lorazepam&quot;:{&quot;name&quot;:&quot;Lorazepam&quot;,&quot;family&quot;:&quot;benzo&quot;,&quot;feature&quot;:&quot;Conjugation; no major active oxidative metabolites&quot;,&quot;explanation&quot;:&quot;Used for anxiety and as an IV seizure-rescue option. It undergoes direct glucuronidation rather than relying on formation and clearance of long-lived oxidative active metabolites.&quot;,&quot;kinetics&quot;:&quot;Inactive glucuronide formation is a useful distinction from diazepam, although age and illness still affect clinical sensitivity.&quot;,&quot;risk&quot;:&quot;Sedation and respiratory depression remain possible; hepatic disease does not make any benzodiazepine automatically harmless.&quot;,&quot;extension&quot;:&quot;A simpler metabolic pathway can reduce certain accumulation concerns without changing the GABA-A pharmacodynamic risks.&quot;,&quot;topics&quot;:[&quot;A16&quot;]},&quot;clobazam&quot;:{&quot;name&quot;:&quot;Clobazam&quot;,&quot;family&quot;:&quot;benzo&quot;,&quot;feature&quot;:&quot;1,5-benzodiazepine; epilepsy adjunct&quot;,&quot;explanation&quot;:&quot;A structurally distinct 1,5-benzodiazepine with anxiolytic and antiseizure uses, including adjunctive treatment in Lennox–Gastaut syndrome.&quot;,&quot;kinetics&quot;:&quot;An active metabolite, N-desmethylclobazam, can contribute substantially to persistence; CYP interactions matter.&quot;,&quot;risk&quot;:&quot;Somnolence, dependence and respiratory interaction risks; serious skin reactions are uncommon but important.&quot;,&quot;extension&quot;:&quot;Its structural classification differs from the common 1,4-benzodiazepines, while its functional target remains the GABA-A benzodiazepine site.&quot;,&quot;topics&quot;:[&quot;A16&quot;]},&quot;oxazepam&quot;:{&quot;name&quot;:&quot;Oxazepam&quot;,&quot;family&quot;:&quot;benzo&quot;,&quot;feature&quot;:&quot;Direct conjugation; slower onset&quot;,&quot;explanation&quot;:&quot;An anxiolytic benzodiazepine also used in alcohol-withdrawal settings. Its onset and pharmacokinetics distinguish it from rapid procedural midazolam.&quot;,&quot;kinetics&quot;:&quot;Direct glucuronidation produces inactive metabolites; it does not generate the same long active-metabolite chain as diazepam.&quot;,&quot;risk&quot;:&quot;Sedation, falls and dependence; it still interacts pharmacodynamically with alcohol/opioids.&quot;,&quot;extension&quot;:&quot;Oxazepam and lorazepam are useful metabolism comparisons, not examples of a new receptor mechanism.&quot;,&quot;topics&quot;:[&quot;A16&quot;]},&quot;chlordiazepoxide&quot;:{&quot;name&quot;:&quot;Chlordiazepoxide&quot;,&quot;family&quot;:&quot;benzo&quot;,&quot;feature&quot;:&quot;Long-acting anxiety/alcohol-withdrawal agent&quot;,&quot;explanation&quot;:&quot;Used for anxiety and alcohol withdrawal, where a sustained inhibitory effect can smooth symptoms across time.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism produces active metabolites, allowing accumulation and prolonged effects.&quot;,&quot;risk&quot;:&quot;Sedation and impaired coordination can persist, especially with reduced metabolic reserve.&quot;,&quot;extension&quot;:&quot;Distinguish it from chloral hydrate: similar-looking beginnings do not make chloral hydrate a benzodiazepine.&quot;,&quot;topics&quot;:[&quot;A16&quot;]},&quot;medazepam&quot;:{&quot;name&quot;:&quot;Medazepam&quot;,&quot;family&quot;:&quot;benzo&quot;,&quot;feature&quot;:&quot;Anxiolytic with active metabolites&quot;,&quot;explanation&quot;:&quot;Included in the course as an anxiolytic benzodiazepine. Its therapeutic effects follow enhancement of GABAergic inhibition, while metabolite formation contributes to persistence.&quot;,&quot;kinetics&quot;:&quot;Converted to active benzodiazepine metabolites, including diazepam-related compounds.&quot;,&quot;risk&quot;:&quot;Delayed/prolonged sedation, dependence and standard sedative interactions.&quot;,&quot;extension&quot;:&quot;A relatively modest immediate sedative impression does not prove short exposure when active metabolites continue to act.&quot;,&quot;topics&quot;:[&quot;A16&quot;]},&quot;flumazenil&quot;:{&quot;name&quot;:&quot;Flumazenil&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;Benzodiazepine-site antagonist&quot;,&quot;explanation&quot;:&quot;Competitively blocks the benzodiazepine binding site on GABA-A receptors, reversing susceptible benzodiazepine effects and some Z-drug effects. It does not antagonise the separate propofol or barbiturate sites.&quot;,&quot;kinetics&quot;:&quot;Its effect may wear off before the sedative, allowing resedation.&quot;,&quot;risk&quot;:&quot;Can precipitate withdrawal or seizures, especially in dependence or mixed proconvulsant overdose.&quot;,&quot;extension&quot;:&quot;&#x27;GABA-A drug&#x27; is too broad to predict reversal. Binding-site specificity explains why flumazenil is not a universal sedative antidote.&quot;,&quot;topics&quot;:[&quot;A16&quot;]},&quot;zolpidem&quot;:{&quot;name&quot;:&quot;Zolpidem&quot;,&quot;family&quot;:&quot;zdrug&quot;,&quot;feature&quot;:&quot;α₁-preferring hypnotic&quot;,&quot;explanation&quot;:&quot;Favours α₁-containing GABA-A receptors at usual exposure, giving a predominantly hypnotic profile. Its chemical structure is not a benzodiazepine despite sharing the binding site.&quot;,&quot;kinetics&quot;:&quot;Relatively short-lived; formulation influences sleep-onset versus sleep-maintenance use.&quot;,&quot;risk&quot;:&quot;Amnesia, next-day impairment and complex sleep behaviours.&quot;,&quot;extension&quot;:&quot;Receptor preference is relative and exposure dependent; it does not make the drug a selective on/off switch for normal sleep.&quot;,&quot;topics&quot;:[&quot;A17&quot;]},&quot;zaleplon&quot;:{&quot;name&quot;:&quot;Zaleplon&quot;,&quot;family&quot;:&quot;zdrug&quot;,&quot;feature&quot;:&quot;Very short duration; sleep-onset emphasis&quot;,&quot;explanation&quot;:&quot;A short-lived hypnotic with α₁-preferring benzodiazepine-site activity. Its time course particularly suits difficulty initiating sleep.&quot;,&quot;kinetics&quot;:&quot;Very short elimination compared with many other hypnotics.&quot;,&quot;risk&quot;:&quot;Amnesia and complex sleep behaviours remain possible despite short persistence.&quot;,&quot;extension&quot;:&quot;A short half-life can reduce residual exposure but may provide less help when the main problem is repeated awakening later in the night.&quot;,&quot;topics&quot;:[&quot;A17&quot;]},&quot;zopiclone&quot;:{&quot;name&quot;:&quot;Zopiclone&quot;,&quot;family&quot;:&quot;zdrug&quot;,&quot;feature&quot;:&quot;Hypnotic; characteristic bitter taste&quot;,&quot;explanation&quot;:&quot;A cyclopyrrolone hypnotic with less α₁ subtype preference than zolpidem/zaleplon. It enhances GABA-dependent inhibition.&quot;,&quot;kinetics&quot;:&quot;Longer persistence than zaleplon; hepatic metabolism and interactions affect residual exposure.&quot;,&quot;risk&quot;:&quot;Bitter/metallic taste, morning impairment and dependence are useful distinguishing features.&quot;,&quot;extension&quot;:&quot;Non-benzodiazepine describes chemical class; pharmacological overlap explains why amnesia and dependence risks do not disappear.&quot;,&quot;topics&quot;:[&quot;A17&quot;]},&quot;melatonin&quot;:{&quot;name&quot;:&quot;Melatonin&quot;,&quot;family&quot;:&quot;melatonin&quot;,&quot;feature&quot;:&quot;Biological-night signal; timing matters&quot;,&quot;explanation&quot;:&quot;The endogenous pineal signal used as a medicine for selected sleep/circadian problems. A dose has both a timing signal and possible sleep-promoting effects.&quot;,&quot;kinetics&quot;:&quot;Formulation changes exposure; immediate and prolonged-release preparations are not interchangeable for every goal.&quot;,&quot;risk&quot;:&quot;Somnolence and altered timing if used at an inappropriate circadian phase.&quot;,&quot;extension&quot;:&quot;Giving a clock signal is different from suppressing consciousness. Ask whether the problem is delayed timing, impaired maintenance or another disorder.&quot;,&quot;topics&quot;:[&quot;A17&quot;]},&quot;tasimelteon&quot;:{&quot;name&quot;:&quot;Tasimelteon&quot;,&quot;family&quot;:&quot;melatonin&quot;,&quot;feature&quot;:&quot;Circadian entrainment; non-24-hour disorder&quot;,&quot;explanation&quot;:&quot;An MT₁/MT₂ agonist associated with treatment of non-24-hour sleep–wake disorder, particularly in relevant totally blind patients.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism; CYP interactions can alter exposure. Entrainment develops over repeated use.&quot;,&quot;risk&quot;:&quot;Headache and somnolence; hepatic laboratory changes can occur.&quot;,&quot;extension&quot;:&quot;A drug that helps synchronise an internal clock addresses a different problem from an immediate sedative for preoperative anxiety.&quot;,&quot;topics&quot;:[&quot;A17&quot;]},&quot;ramelteon&quot;:{&quot;name&quot;:&quot;Ramelteon&quot;,&quot;family&quot;:&quot;melatonin&quot;,&quot;feature&quot;:&quot;MT₁/MT₂ agonist for sleep onset&quot;,&quot;explanation&quot;:&quot;A melatonin-receptor agonist used for sleep-onset insomnia. It does not act at the benzodiazepine GABA-A site.&quot;,&quot;kinetics&quot;:&quot;Hepatic metabolism, particularly CYP1A2, creates important interaction distinctions.&quot;,&quot;risk&quot;:&quot;Somnolence and dizziness; strong CYP1A2 inhibition can substantially increase exposure.&quot;,&quot;extension&quot;:&quot;Flumazenil would not be expected to reverse it because receptor-site competition requires the same binding site.&quot;,&quot;topics&quot;:[&quot;A17&quot;]},&quot;alpha2-class&quot;:{&quot;name&quot;:&quot;α₂-adrenergic agonists — class entry&quot;,&quot;family&quot;:&quot;alpha2&quot;,&quot;feature&quot;:&quot;Reduce noradrenergic arousal&quot;,&quot;explanation&quot;:&quot;The A17 class entry links to drugs such as dexmedetomidine and clonidine. Sedation follows reduced central sympathetic/arousal signalling; individual indications and routes differ.&quot;,&quot;kinetics&quot;:&quot;Clearance and duration are drug dependent; do not assign a single class half-life.&quot;,&quot;risk&quot;:&quot;Bradycardia, hypotension and rebound after abrupt withdrawal are class-relevant concerns.&quot;,&quot;extension&quot;:&quot;Compare with gabapentin/pregabalin: the α₂δ calcium-channel subunit is not an adrenergic α₂ receptor.&quot;,&quot;topics&quot;:[&quot;A17&quot;]},&quot;buspirone&quot;:{&quot;name&quot;:&quot;Buspirone&quot;,&quot;family&quot;:&quot;individual&quot;,&quot;feature&quot;:&quot;5-HT₁A partial agonist; delayed anxiolysis&quot;,&quot;explanation&quot;:&quot;Acts mainly through 5-HT₁A partial agonism in serotonergic circuits. It can treat generalised anxiety with relatively little sedation and lacks the reliable muscle-relaxant/anticonvulsant profile of benzodiazepines.&quot;,&quot;kinetics&quot;:&quot;Clinical benefit develops over days to weeks, despite drug exposure occurring much earlier; hepatic CYP3A metabolism matters.&quot;,&quot;risk&quot;:&quot;Dizziness, nausea and serotonergic interactions. It is not a rapid rescue for an acute panic episode.&quot;,&quot;extension&quot;:&quot;Receptor adaptation and circuit changes help explain why a directly acting receptor drug can still have delayed therapeutic benefit.&quot;,&quot;topics&quot;:[&quot;A17&quot;]},&quot;ssri-class&quot;:{&quot;name&quot;:&quot;SSRIs — class entry&quot;,&quot;family&quot;:&quot;ssri&quot;,&quot;feature&quot;:&quot;Long-term anxiety treatment; delayed benefit&quot;,&quot;explanation&quot;:&quot;Selected SSRIs treat anxiety disorders as well as depression. The exact licensed disorder varies by drug, so a class label should lead to the individual A19 medicines.&quot;,&quot;kinetics&quot;:&quot;Metabolic half-life and CYP inhibition differ substantially between agents.&quot;,&quot;ris

omnolence and dizziness can occur. An agent that shifts circadian timing is not automatically an immediate rescue medicine for severe anxiety or a treatment for every cause of insomnia.&quot;},&quot;alpha2&quot;:{&quot;name&quot;:&quot;Central α₂-adrenoceptor agonism&quot;,&quot;mechanism&quot;:&quot;Central α₂ receptors couple to Gi/o proteins. Their activation decreases cyclic AMP and calcium-dependent noradrenaline release, while increasing inhibitory influences on neuronal firing. In the locus coeruleus and other arousal/autonomic circuits this reduces sympathetic output and promotes sedation. Spinal actions can contribute to analgesia. Location explains the apparent paradox: activating an adrenergic receptor can lower sympathetic activity.&quot;,&quot;risk&quot;:&quot;Bradycardia and hypotension follow reduced sympathetic drive. Abrupt cessation after sustained exposure can cause rebound sympathetic activity. Relatively preserved respiratory drive with some agents does not guarantee a protected airway.&quot;},&quot;ssri&quot;:{&quot;name&quot;:&quot;Selective serotonin reuptake inhibition&quot;,&quot;mechanism&quot;:&quot;The serotonin transporter (SERT) retrieves released serotonin into the presynaptic neuron. Blocking SERT increases extracellular serotonin, which acts on several receptor subtypes rather than a single &#x27;antidepressant receptor&#x27;. Transporter inhibition occurs promptly, but changes in autoreceptor feedback, network activity and plasticity contribute to the slower clinical response. Depression cannot be reduced to a universally demonstrated serotonin deficiency.&quot;,&quot;risk&quot;:&quot;Nausea, sexual dysfunction, sleep changes, hyponatraemia and increased bleeding tendency can occur. Combining serotonergic mechanisms, especially with monoamine oxidase inhibition, can cause serotonin toxicity. Withdrawal symptoms reflect abrupt adaptation to falling exposure and are not identical to addiction.&quot;},&quot;tca&quot;:{&quot;name&quot;:&quot;Tricyclic transporter and receptor blockade&quot;,&quot;mechanism&quot;:&quot;Tricyclic antidepressants inhibit serotonin and/or noradrenaline transporters. Stronger monoamine signalling in relevant brain circuits can improve depression, and enhanced descending noradrenergic inhibition can reduce neuropathic pain. Their additional receptor actions are essential: muscarinic blockade causes dry mouth and retention, H₁ histamine blockade promotes sedation, and α₁ blockade impairs standing vasoconstriction. Relative transporter and receptor affinities differ between drugs.&quot;,&quot;risk&quot;:&quot;Cardiac fast sodium-channel blockade in overdose can widen QRS complexes and produce dangerous arrhythmias. Anticholinergic effects, orthostatic hypotension and sedation often limit tolerability. Their analgesic role does not imply direct opioid-receptor agonism.&quot;},&quot;snri&quot;:{&quot;name&quot;:&quot;Serotonin and noradrenaline reuptake inhibition&quot;,&quot;mechanism&quot;:&quot;Blocking SERT and the noradrenaline transporter (NET) prolongs monoamine signalling after release. Brain network adaptation contributes to antidepressant and anxiolytic effects. In descending pain-control pathways, increased noradrenergic signalling can activate inhibitory spinal α₂ receptors, reducing pain transmission. The balance of SERT and NET inhibition varies by drug and, for some drugs, by dose.&quot;,&quot;risk&quot;:&quot;Serotonergic adverse effects overlap with SSRIs. Noradrenergic effects can increase blood pressure, sweating and heart rate. Abrupt discontinuation may cause symptoms, especially with shorter-lived drugs. A biochemical effect within hours does not mean full mood benefit within hours.&quot;},&quot;antipsychotic&quot;:{&quot;name&quot;:&quot;Dopamine-pathway modulation&quot;,&quot;mechanism&quot;:&quot;Reducing excessive dopamine D₂ signalling in relevant striatal/mesolimbic circuits can improve positive psychotic symptoms. The same receptor has other jobs: nigrostriatal interference can cause movement disorders, and pituitary D₂ blockade removes dopamine&#x27;s tonic inhibition of prolactin release. H₁, muscarinic, α₁ and serotonin receptor effects vary by drug and help explain sedation, metabolic effects and orthostasis. The classic four-pathway model is useful but does not fully explain psychosis.&quot;,&quot;risk&quot;:&quot;Acute dystonia, akathisia, parkinsonism and tardive dyskinesia are distinct syndromes. Fever, marked rigidity, altered mental state and autonomic instability suggest neuroleptic malignant syndrome. Higher potency means less drug is needed for an effect; it does not automatically mean greater maximum efficacy.&quot;},&quot;partiald2&quot;:{&quot;name&quot;:&quot;D₂-family partial agonism&quot;,&quot;mechanism&quot;:&quot;A partial agonist binds a receptor but produces less intrinsic activation than dopamine. In a high-dopamine environment it competes with dopamine and can reduce overall receptor signalling; where dopamine tone is lower it retains some stimulation. This helps explain a different prolactin and motor profile from pure D₂ antagonists. The result still depends on receptor occupancy, circuit and the drug&#x27;s other receptor actions.&quot;,&quot;risk&quot;:&quot;Akathisia, agitation and other extrapyramidal symptoms remain possible. &#x27;Partial agonist&#x27; does not mean half a dose or uniformly half the effect in every tissue.&quot;},&quot;sodium&quot;:{&quot;name&quot;:&quot;Use-dependent neuronal Na⁺-channel modulation&quot;,&quot;mechanism&quot;:&quot;Repeated depolarisation cycles sodium channels through open and inactivated states. Stabilising inactivation leaves fewer channels ready for the next action potential, preferentially limiting high-frequency repetitive firing and seizure propagation. This links antiseizure pharmacology to local anaesthetics and antiarrhythmics, although the tissue, selectivity and clinical exposure differ. Seizure type matters: suppressing focal firing does not guarantee benefit in thalamocortical absence rhythms.&quot;,&quot;risk&quot;:&quot;Dizziness, diplopia and ataxia can reflect effects on normal neuronal firing. Individual drugs differ greatly in interactions, rash risk and seizure spectrum. Clinical antiseizure benefit is not proof that the underlying cause of epilepsy has been cured.&quot;},&quot;gabapentinoid&quot;:{&quot;name&quot;:&quot;α₂δ calcium-channel subunit binding&quot;,&quot;mechanism&quot;:&quot;Gabapentinoids bind the α₂δ auxiliary subunit of voltage-gated calcium channels. They alter channel trafficking/function in excitatory pathways and reduce transmitter release, helping focal seizures and some neuropathic pain. Despite their names and structural relationship to GABA, they do not act as GABA-A or GABA-B receptor agonists. The α₂δ subunit is also entirely different from an α₂-adrenoceptor.&quot;,&quot;risk&quot;:&quot;Dizziness, sedation, oedema and weight gain are characteristic. Renal elimination makes kidney function important for exposure. Opioids or respiratory disease increase the risk of serious respiratory depression.&quot;},&quot;sv2a&quot;:{&quot;name&quot;:&quot;Synaptic vesicle protein 2A modulation&quot;,&quot;mechanism&quot;:&quot;SV2A is a protein involved in synaptic vesicle function. Binding to SV2A modulates transmitter release and helps reduce abnormal network synchronisation. This acts at the presynaptic vesicle machinery rather than by directly stimulating GABA receptors or blocking a postsynaptic glutamate receptor. The precise translation from binding to every clinical antiseizure effect remains incompletely understood.&quot;,&quot;risk&quot;:&quot;Somnolence and dizziness can occur; behavioural and psychiatric adverse effects deserve attention. Higher binding affinity does not by itself prove a proportionally greater clinical benefit.&quot;},&quot;antimuscarinic&quot;:{&quot;name&quot;:&quot;Muscarinic acetylcholine-receptor antagonism&quot;,&quot;mechanism&quot;:&quot;Muscarinic receptors mediate parasympathetic effects and also participate in central circuits. Blocking cardiac M₂ receptors reduces vagal slowing of sinoatrial and atrioventricular activity. Blocking glandular M₃ receptors reduces secretions. In the striatum, central antimuscarinic effects reduce cholinergic influence relative to dopamine. The anatomical target, not the word &#x27;anticholinergic&#x27; alone, determines the clinical purpose.&quot;,&quot;risk&quot;:&quot;Dry mouth, blurred near vision, constipation, urinary retention and tachycardia can occur. Brain penetration can produce confusion, especially in susceptible older patients. Muscarinic blockade is not blockade of nicotinic neuromuscular transmission.&quot;},&quot;dopamineagonist&quot;:{&quot;name&quot;:&quot;D₂-like dopamine-receptor agonism&quot;,&quot;mechanism&quot;:&quot;In Parkinson disease, loss of nigrostriatal dopamine makes basal ganglia output excessively inhibitory to thalamocortical motor drive. A dopamine agonist directly stimulates dopamine receptors, bypassing the need for surviving terminals to convert levodopa into dopamine. Motor benefit is accompanied by effects in reward, sleep and autonomic circuits; these locations explain adverse effects beyond movement.&quot;,&quot;risk&quot;:&quot;Nausea, orthostatic hypotension, hallucinations, sudden sleep episodes and impulse-control disorders can occur. Symptomatic improvement does not establish that neuronal degeneration has stopped.&quot;},&quot;maob&quot;:{&quot;name&quot;:&quot;MAO-B inhibition&quot;,&quot;mechanism&quot;:&quot;Monoamine oxidase B (MAO-B) contributes to dopamine metabolism in the brain. Inhibiting it prolongs available dopamine and can improve Parkinson symptoms or extend levodopa benefit. Selectivity is dose dependent. This differs from the predominantly MAO-A inhibition of moclobemide in the antidepressant topic, where serotonin and noradrenaline are central to the teaching comparison.&quot;,&quot;risk&quot;:&quot;Interactions with serotonergic drugs and certain opioids remain relevant. Reduced production of oxidative metabolites is a mechanistic hypothesis, not established proof of clinical neuroprotection.&quot;},&quot;ache&quot;:{&quot;name&quot;:&quot;Cholinesterase inhibition in cognition&quot;,&quot;mechanism&quot;:&quot;Degeneration of basal forebrain cholinergic projections contributes to impaired attention and memory in Alzheimer disease. Inhibiting cholinesterase slows breakdown of acetylcholine after its release, increasing signalling at remaining synapses. This can provide modest symptomatic benefit; it does not replace dead neurons. Peripheral acetylcholine also rises, linking the intended mechanism to gastrointestinal and cardiac adverse effects.&quot;,&quot;risk&quot;:&quot;Nausea, diarrhoea, weight loss, bradycardia and syncope can occur. More acetylcholine is not automatically better in every organ, and improvement is not evidence of disease reversal.&quot;},&quot;individual&quot;:{&quot;name&quot;:&quot;Drug-specific mechanism&quot;,&quot;mechanism&quot;:&quot;&quot;,&quot;risk&quot;:&quot;&quot;}},&quot;entryCount&quot;:182}&lt;/script&gt;

    const root=document.getElementById(&#x27;pharm-map-2026&#x27;);

    const topics=root.querySelector(&#x27;#pm-topics&#x27;),tree=root.querySelector(&#x27;#pm-tree&#x27;),detail=root.querySelector(&#x27;#pm-detail&#x27;),select=root.querySelector(&#x27;#pm-topic-select&#x27;);
    const drugSelect=root.querySelector(&#x27;#pm-drug-select&#x27;),mapToggle=root.querySelector(&#x27;#pm-map-toggle&#x27;);
    const esc=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
    // Match source phrases without rewriting the medical explanation.
    const termGroups={
      mechanism:[
        &#x27;GABA-A&#x27;,&#x27;GABA-B&#x27;,&#x27;GABAergic inhibition&#x27;,&#x27;GABA-dependent inhibition&#x27;,&#x27;GABA-binding site&#x27;,&#x27;GABA&#x27;,&#x27;NMDA&#x27;,&#x27;AMPA&#x27;,&#x27;α₂δ&#x27;,&#x27;α₂-adrenoceptor&#x27;,&#x27;α₂ receptors&#x27;,&#x27;α₁ blockade&#x27;,&#x27;α₁&#x27;,&#x27;D₂&#x27;,&#x27;D₃&#x27;,&#x27;M₂&#x27;,&#x27;M₃&#x27;,&#x27;H₁&#x27;,&#x27;MT₁&#x27;,&#x27;MT₂&#x27;,&#x27;5-HT₁B/₁D&#x27;,&#x27;5-HT₁D&#x27;,&#x27;5-HT₁B&#x27;,&#x27;5-HT₂A&#x27;,&#x27;5-HT₁A&#x27;,&#x27;5-HT₃&#x27;,&#x27;μ (mu) opioid receptor&#x27;,&#x27;μ-opioid&#x27;,&#x27;κ&#x27;,&#x27;δ&#x27;,&#x27;SERT&#x27;,&#x27;NET&#x27;,&#x27;DAT&#x27;,&#x27;SV2A&#x27;,&#x27;CGRP&#x27;,&#x27;COX-1&#x27;,&#x27;COX-2&#x27;,&#x27;COX&#x27;,&#x27;MAO-A&#x27;,&#x27;MAO-B&#x27;,&#x27;COMT&#x27;,&#x27;11β-hydroxylase&#x27;,&#x27;SMN2&#x27;,&#x27;SMN1&#x27;,&#x27;exon 7&#x27;,&#x27;antisense oligonucleotide&#x27;,&#x27;splice-silencing site&#x27;,&#x27;voltage-gated sodium channels&#x27;,&#x27;sodium-channel blockade&#x27;,&#x27;sodium channels&#x27;,&#x27;Na⁺&#x27;,&#x27;T-type calcium currents&#x27;,&#x27;calcium channels&#x27;,&#x27;potassium channels&#x27;,&#x27;chloride channels&#x27;,&#x27;chloride conductance&#x27;,&#x27;Gi/o&#x27;,&#x27;cyclic AMP&#x27;,&#x27;cyclooxygenase&#x27;,&#x27;prostaglandin E₂&#x27;,&#x27;muscarinic blockade&#x27;,&#x27;muscarinic receptors&#x27;,&#x27;nicotinic-receptor antagonist&#x27;,&#x27;serotonin transporter&#x27;,&#x27;noradrenaline transporter&#x27;,&#x27;noradrenaline/dopamine reuptake&#x27;,&#x27;serotonin reuptake&#x27;,&#x27;noradrenaline reuptake&#x27;,&#x27;cholinesterase&#x27;,&#x27;acetylcholinesterase&#x27;,&#x27;monoamine oxidase&#x27;,&#x27;partial agonist&#x27;,&#x27;partial agonism&#x27;,&#x27;competitive antagonist&#x27;,&#x27;irreversible inhibition&#x27;,&#x27;allosteric site&#x27;,&#x27;benzodiazepine site&#x27;,&#x27;frequency of channel opening&#x27;,&#x27;use dependent&#x27;,&#x27;use-dependent&#x27;,&#x27;inactivated channels&#x27;,&#x27;inactivated states&#x27;,&#x27;stabilising inactivation&#x27;,&#x27;hyperpolarises&#x27;,&#x27;presynaptic calcium entry&#x27;,&#x27;postsynaptic potassium conductance&#x27;,&#x27;substance P&#x27;,&#x27;trigeminal terminals&#x27;,&#x27;suprachiasmatic nucleus&#x27;,&#x27;locus coeruleus&#x27;,&#x27;nigrostriatal&#x27;,&#x27;mesolimbic&#x27;,&#x27;prolactin&#x27;,&#x27;glucuronidation inhibition&#x27;
